# 9. GINECOLOGÍA

**Fuente:** Manual de derivación a Consultorio Adosado de Especialidades Obstétricas y Ginecológicas (CAEOG), código SCOG 24, versión 1, aprobado en noviembre de 2024, vigente hasta noviembre de 2029.

## Prioridades

- **P0:** derivación y atención inmediata en la Urgencia del SCOG (Maternidad).
- **P1 – Alta prioridad:** derivación y atención prioritaria en la Unidad de Ginecología del CAEOG.
- **P2 – Mediana prioridad:** derivación y atención según disponibilidad del recurso médico en la Unidad de Ginecología del CAEOG.

### Subunidades de la Unidad de Ginecología del CAEOG
1. **Ginecología General (GG):** sangrado uterino anormal, sangrado de la postmenopausia, patología anexial benigna, entre otras.
2. **Ginecología Oncológica (GO):** patología oncológica confirmada o de alta sospecha clínica y patología cervical.
3. **Piso Pélvico Femenino (UPPF):** incontinencia de orina y prolapso de órganos pélvicos.
4. **Endocrinología y Reproducción Humana (UGER):** infertilidad, climaterio, anticoncepción y ginecología infantojuvenil (usuarias de 15 a 25 años).
5. **Ecografía Ginecológica (EG):** ecografía ginecológica, histerosonografía, ecografía de endometriosis extendida, 3D y de piso pélvico femenino.

### Vía de derivación
1. Interconsulta emitida por médico o matrón(a), con la prioridad que asignan los criterios del manual.
2. La usuaria acude con copia de los exámenes de laboratorio y ecografías realizadas.
3. Las P1 siguen la vía establecida en el manual de Unidad de Red vigente. Si es patología GES, registrar en TrakCare.
4. APS da seguimiento a sus derivaciones y actualiza la información si cambia la condición clínica.
5. Aunque sea derivada, la usuaria continúa sus controles de regulación de fertilidad, climaterio y prevención de cáncer cervicouterino y mamario en APS.

> **Alcance:** pese a su título, el SCOG 24 contiene solo criterios de la Unidad de Ginecología. No incluye criterios obstétricos.

## Requisitos generales de toda interconsulta a Ginecología CAEOG

### Datos clínicos
- Gesta/para/abortos.
- Tipo de parto (vaginal, cesárea, fórceps) y peso máximo del recién nacido.
- Menarquia.
- Menopausia.
- Terapia hormonal: cuál y tiempo de uso.
- Fecha de última regla.
- Ritmo menstrual: días, duración de ciclos, cuantía, dismenorrea.
- Método anticonceptivo actual.
- Antecedentes mórbidos y fármacos.
- Antecedentes quirúrgicos: cuál y año.
- Alergias y hábitos (tabaco, alcohol, drogas).
- Presencia o ausencia de sangrado uterino anormal o postmenopáusico y sus características.
- Presencia o ausencia de dolor y sus características (acíclico, dismenorrea, dispareunia).
- Síntomas de prolapso, según su flujograma.

### Examen y estudios
- Peso, talla y presión arterial.
- Descripción del examen ginecológico.
- Descripción de prolapso si corresponde, según su flujograma.
- PAP con resultado y año.
- Ecografía transvaginal con resultado y año.
- Mamografía con resultado y año.
- Ecografía mamaria con resultado y año.

### Requisito mínimo
- PAP y mamografía con resultados vigentes.

**Excepciones consignadas:**
1. Imposibilidad de actualizar PAP por sangrado constante, con cuello no sospechoso de cáncer cervicouterino.
2. Si existe sospecha de cáncer cervicouterino: derivar a Ginecología Oncológica/GES.
3. Para terapia hormonal: mamografía de menos de 1 año.

## IMC y derivación: tabla general

El SCOG 24 usa el IMC con cortes distintos según la patología, y en otras solo nombra "obesidad" sin fijar un valor. Esta tabla reúne todos los usos del IMC en el manual.

:::calc imc-tabla

### Dónde el manual exige informar peso, talla o IMC
1. Toda interconsulta a Ginecología: peso, talla y presión arterial.
2. Masa anexial categoría B: la SIC debe incluir IMC.
3. Esterilización quirúrgica: IMC es requisito para aceptar la interconsulta.
4. Infertilidad: talla y peso en los requisitos de la interconsulta.
5. Prolapso: peso, talla e IMC en el resumen de derivación a UPPF.

## Sangrado uterino anormal crónico

**Definición del algoritmo:** 6 o más meses de sangrado de excesiva duración, volumen o frecuencia.

:::flujo sua

### Manejo en APS: evaluación inicial
- Historia estructurada: características del sangrado, sangrados no ginecológicos, uso de MAC o THM.
- Examen físico.
- Exámenes: hemograma, test de embarazo y ecografía, más evaluación de comorbilidades.

**Si el sangrado es atribuible a adenomiosis, mioma o pólipo:** seguir el algoritmo de esa patología.

### Criterio de derivación (P1)
- Sangrado uterino anormal no atribuible a anormalidad estructural, con al menos un factor de riesgo de hiperplasia endometrial:
  - Edad > 45 años.
  - Diabetes mellitus.
  - Anovulación crónica.
  - Obesidad.
  - Uso de tamoxifeno.
  - Terapia con estrógenos sin oposición.
  - Síndrome de Cowden.
  - Síndrome de Lynch.

> El manual nombra "obesidad" como factor de riesgo sin definir un corte de IMC.

## Miomas uterinos

:::flujo miomas

### Derivar a Urgencia Ginecológica
- Anemia severa (Hb < 7 g/dL o sintomática).
- Abdomen agudo ginecológico.

### Criterios de derivación a Ginecología General (P1)
- Miomas asociados a síntomas compresivos urinarios o cambios en el hábito defecatorio.
- Miomas palpables y sintomáticos.
- Sangrado uterino anormal que no mejora con tratamiento por 3 a 6 meses (sangrado persistente, anemia secundaria descartando otro origen o dolor pélvico de origen ginecológico asociado).

### Criterio de derivación en miomas asintomáticos
- Tumor palpable abdomino-pélvico y/o miomas > 5 cm en ecografía.

> El flujograma deriva este caso a Ginecología General, pero la caja P1 del manual solo nombra miomas sintomáticos. La prioridad de este criterio no está consignada.

### Alternativas terapéuticas en APS para el sangrado
1. Hormonal, según criterios de elegibilidad OMS: anticonceptivos orales combinados, progestinas solas o DIU con levonorgestrel.
2. No hormonal: AINEs.

### No derivar
- Miomas asintomáticos, sin tumor palpable y de 5 cm o menos en ecografía.
- Sangrado que responde al manejo: controles en APS.

## Adenomiosis

:::flujo adenomiosis

### Derivar a Urgencia Ginecológica
- Anemia severa (Hb < 7 g/dL o sintomática).
- Abdomen agudo ginecológico.

### Criterios de derivación a Ginecología General (P1)
- Adenomiosis asociada a síntomas compresivos urinarios o cambios en el hábito defecatorio.
- Útero palpable y sintomático.
- Sangrado uterino anormal que no mejora con tratamiento por 3 a 6 meses (sangrado persistente, anemia secundaria descartando otro origen o dolor pélvico de origen ginecológico asociado).

### Criterio de derivación en adenomiosis asintomática
- Tumor palpable abdomino-pélvico y/o útero > 10 cm en ecografía.

> El flujograma deriva este caso a Ginecología General, pero la caja P1 del manual solo nombra casos sintomáticos. La prioridad de este criterio no está consignada.

### Alternativas terapéuticas en APS para el sangrado
1. Hormonal, según criterios de elegibilidad OMS: anticonceptivos orales combinados, progestinas solas o DIU con levonorgestrel.
2. No hormonal: AINEs.

### No derivar
- Adenomiosis asintomática, sin tumor palpable y con útero de 10 cm o menos en ecografía.
- Sangrado que responde al manejo: controles en APS.

## Engrosamiento endometrial en postmenopáusicas

:::flujo endometrio

### Criterios de derivación a atención secundaria (P1)
- Postmenopáusica sintomática: todo sangrado uterino.
- Postmenopáusica asintomática con endometrio > 11 mm.
- Postmenopáusica asintomática con endometrio de 4 a 11 mm más factores de riesgo.

> El algoritmo dice "factores de riesgo" sin enumerarlos. A continuación el manual adjunta la tabla de factores de riesgo para cáncer de endometrio. No consigna conducta para endometrio bajo 4 mm ni para 4 a 11 mm sin factores de riesgo.

:::calc endometrio

### Factores de riesgo para cáncer de endometrio (tabla del manual)
1. Edad creciente: 1 a 2% de incidencia acumulada entre 50 y 70 años.
2. Terapia de estrógenos sin oposición: RR 2 a 10.
3. Terapia con tamoxifeno: RR 2.
4. Menarquia temprana: sin dato.
5. Menopausia tardía (después de los 55 años): RR 2.
6. Nuliparidad: RR 2.
7. Síndrome de ovario poliquístico (anovulación crónica): RR 3.
8. Obesidad, cáncer de endometrio tipo I: OR 1,5 con IMC 25 a < 30; OR 2,5 con IMC 30 a < 35; OR 4,5 con IMC 35 a 39,9; OR 7,1 con IMC ≥ 40.
9. Obesidad, cáncer de endometrio tipo II: OR 1,2 con IMC 25 a < 30; OR 1,7 con IMC 30 a < 35; OR 2,2 con IMC 35 a 39,9; OR 3,1 con IMC ≥ 40.
10. Diabetes mellitus: RR 2.
11. Tumor secretor de estrógenos: sin dato.
12. Síndrome de Lynch: 13 a 71% de riesgo de por vida.
13. Síndrome de Cowden: 13 a 28% de riesgo de por vida.
14. Antecedentes familiares de cáncer de endometrio, ovario, mama o colon: sin dato.

:::calc imc endometrio

## Pólipo endometrial

:::flujo polipo

### Derivar a Urgencia Maternidad HBLT
- Anemia severa: Hb < 7.
- Anemia moderada sintomática: Hb entre 7 y 10.

> El manual consigna la unidad de hemoglobina como "mg/dl".

### Criterio de derivación a Ginecología (P1)
- Usuaria postmenopáusica, con o sin síntomas.

### Criterios de derivación en premenopáusicas
- Asintomática con algún factor de riesgo: pólipo > 20 mm, hipertensión arterial, diabetes mellitus, obesidad o uso de tamoxifeno. Destino: Ginecología.
- Sangrado uterino anormal que persiste tras el manejo inicial en APS. Destino: Ginecología.
- Sin sangrado uterino anormal, con infertilidad (sin embarazo tras 1 año de relaciones regulares sin protección) y deseo de fertilidad actual. Destino: UGER.

> El manual no consigna prioridad para los criterios de premenopáusicas.

### Manejo inicial en APS de premenopáusica con sangrado
1. Iniciar anticonceptivos orales combinados, progestágenos solos o DIU medicado, según criterios de elegibilidad OMS.
2. Control clínico dentro de 3 a 6 meses.

### No derivar
- Premenopáusica asintomática sin factores de riesgo: seguimiento en APS con control clínico y ecográfico en 1 año.
- Sangrado que cede con el manejo inicial: continuar controles en APS.

:::calc polipo

## Pólipo endocervical

### P1
- Usuaria postmenopáusica sintomática (sangrado) o con antecedente de PAP alterado.

### P2
- Sangrado genital sin otra causa en usuaria premenopáusica.
- Usuaria postmenopáusica asintomática.

**En mayores de 65 años sin seguimiento adecuado** (al menos 3 PAP negativos consecutivos): tomar PAP y derivar con el resultado.

## Enfermedad inflamatoria pélvica

:::flujo eip

### Derivar a Urgencia (P0)
- Sospecha de EIP (dolor pélvico más 1 o más criterios mínimos): derivar a Urgencias Ginecológicas de la red según corresponda (CABL, HEP, HPSB, HSLB).

### Criterios diagnósticos del algoritmo
1. **Mínimos:** sensibilidad al movimiento cervical, sensibilidad uterina, sensibilidad en anexos.
2. **Adicionales (aumentan especificidad):** temperatura oral > 38,3 °C; secreción mucopurulenta cervical anormal o friabilidad cervical; abundantes leucocitos en la microscopía salina del fluido vaginal; VHS elevada; PCR elevada; infección cervical documentada por *N. gonorrhoeae* o *C. trachomatis*.

### Conducta en Urgencia según el algoritmo
1. Ecografía transvaginal para descartar o confirmar complicaciones y muestras endocervicales si hay disponibilidad.
2. **Hospitalización en nivel terciario si:** no se pueden excluir emergencias quirúrgicas (por ejemplo, apendicitis), absceso tubo-ovárico, embarazo, enfermedad grave con náuseas, vómitos o fiebre alta, incapacidad de seguir o tolerar un régimen oral ambulatorio, o sin respuesta clínica a la terapia oral después de 72 horas.
3. **Manejo ambulatorio:** ceftriaxona 500 mg IM una vez; doxiciclina 100 mg cada 12 horas vía oral por 14 días; metronidazol 500 mg cada 12 horas vía oral por 14 días.
4. Reevaluar en 48 a 72 horas: cese de la fiebre y reducción de la sensibilidad abdominal, uterina, anexial y cervical. Si responde, completar 14 días; si no, hospitalizar.
5. No olvidar búsqueda activa de otras ITS y tratar a la pareja (SIC UNACESS): ceftriaxona 500 mg IM más azitromicina 1 g vía oral, una vez.

## Masa anexial

:::flujo anexial

### Categoría A: derivar a Urgencia Maternidad
- Abdomen agudo quirúrgico.
- Sospecha de embarazo ectópico.
- Irritación peritoneal.
- Flujo genital purulento.
- Fiebre o vómitos.
- Compromiso del estado general.
- Hemodinamia alterada.

**Manejo inicial según gravedad:** acceso venoso, volemización con cristaloides, control de signos vitales y traslado en ambulancia. SIC a Servicio de Urgencia con datos clínicos y exámenes que apoyen la sospecha.

> En la tabla de priorización el manual rotula la categoría A como "Prioridad 1 (Alta)", aunque la conducta es derivación inmediata a Urgencia.

### Criterios de categoría B (P1)
- a. Tumor quístico unilocular > 5 cm.
- b. Tumor quístico multilocular.
- c. Pared irregular, papila(s) o componente sólido.
- d. Tumor bilateral.
- e. Tumor sólido.
- f. Doppler color de alto flujo (score 3 a 4).
- g. Ascitis.
- h. CA-125 elevado. Valor normal: premenopausia ≤ 50 años < 200 UI/mL; premenopausia > 50 años < 100 UI/mL; postmenopausia < 35 UI/mL.

### Destino en categoría B
1. Si presenta d, e, f, g o h: Oncoginecología.
2. Resto: Ginecología General CABL.
3. La SIC debe contener siempre morbilidades crónicas, IMC, sintomatología actual y fecha y resultado del último PAP.

### Criterio de categoría C (P2)
- Persistencia de síntomas o aparición de elementos de categoría B en el control en APS con ecografía a las 6 a 12 semanas. Destino: Ginecología General CABL.

### Conducta sin criterios A ni B
1. Controlar en APS con ecografía en 6 a 12 semanas.

:::calc anexial

## Anticoncepción

:::flujo anticoncepcion

### Derivar a Urgencias
- Sospecha de perforación uterina.
- Sospecha de enfermedad inflamatoria pélvica.
- Sospecha de tromboembolismo venoso.

### Criterios de derivación a Policlínico de Alto Riesgo Reproductivo
- Comorbilidades de mayor complejidad.
- Dificultad técnica en la inserción.
- Complicaciones en el seguimiento: implante profundo, DIU sin guías no extraíble u otras.
- Reacciones adversas sin respuesta a manejo.
- Intolerancia a múltiples MAC.

### Prioridad P1
- Adolescentes que cumplan criterios de derivación.
- Usuarias con enfermedades crónicas descompensadas.
- Usuarias con múltiples comorbilidades de mayor complejidad.

### Consejería y control en APS
1. Consejería y control de regulación de fertilidad en APS: historia clínica, examen físico, EMPA y tamizaje PAP.
2. Aplicar criterios de elegibilidad OMS 2015 y Normas de regulación de la fertilidad 2016.
3. **Inicio rápido (quick start), considerar si:** no ha tenido relaciones desde la última menstruación normal; ha usado correcta y consistentemente un método; está en los primeros 7 días de su menstruación; está en los primeros 6 meses posparto en amenorrea de lactancia y lactancia exclusiva; está en las primeras 4 semanas posparto sin lactancia exclusiva; o está en los primeros 7 días postaborto.
4. **Uso de DIU:** control al mes de la inserción, a los 3 meses y anual. Si hay dolor, AINEs, descartando EIP y expulsión o malposición. Si se sospecha EIP, derivar a Urgencia.
5. **DIU sin guías:** descartar embarazo; explorar el canal cervical con pinza fina de Bozzeman; usar instrumento apropiado (crochet o hélix) para extraerlo. Si no se puede extraer, solicitar ecografía y derivar según resultado. Si se sospecha DIU extrauterino, derivar; se puede solicitar radiografía de pelvis.
6. **Sangrado con progestágenos solos:** examinar y, si es normal, descartar embarazo. Si persiste e incomoda (implantes, POP, AMPD): AOC con 30 mcg de EE por 7 a 21 días; AINEs (ibuprofeno 600 a 800 mg al día o naproxeno 550 mg cada 12 horas por 5 días); adelantar dosis de AMPD si la última fue hace 4 o más semanas.

### En transición menopáusica
1. **MAC no hormonal:** sobre 50 años, suspender tras 1 año de amenorrea; bajo 50 años, esperar 2 años.
2. **MAC hormonal combinado:** FSH tras 6 o más semanas de suspender el método. Con FSH > 30 UI/L en 2 o más mediciones separadas al menos 2 meses y amenorrea, suspender tras 1 año si es mayor de 50 años o tras 2 años si es menor de 50.
3. **POP (excepto desogestrel), AMPD, implantes y DIU:** se puede medir FSH sin suspender el método, con los mismos criterios.

## Criterios de elegibilidad OMS 2015 (categorías 3 y 4)

**Categoría 4:** riesgo de salud inadmisible si se usa el método. **Categoría 3:** los riesgos generalmente superan las ventajas. Categoría 2: las ventajas generalmente superan los riesgos. Categoría 1: sin restricción.

### Progestágenos solos
1. **Categoría 4:** cáncer de mama actual.
2. **Categoría 3, todos los métodos:** TVP o embolía pulmonar presente; sangrado vaginal inexplicado (excepto píldoras); antecedente de cáncer de mama sin evidencia de enfermedad por 5 años; cirrosis descompensada; tumores hepáticos (adenoma hepatocelular, hepatoma maligno); LES con anticuerpos antifosfolípidos positivos o desconocidos; migraña con aura que aparece durante el uso; cardiopatía isquémica (inicio y continuación); ACV (continuación).
3. **Categoría 3, solo inyectables:** lactancia en las primeras 6 semanas posparto; múltiples factores de riesgo cardiovascular; HTA severa (≥ 160/100) o con daño vascular; cardiopatía isquémica; ACV; diabetes con nefropatía, retinopatía, enfermedad vascular o más de 20 años de evolución; LES con trombocitopenia severa (inicio).
4. **Categoría 3, solo píldoras e implantes:** cardiopatía isquémica y ACV si aparecen durante el uso.
5. **Categoría 3, solo píldoras:** anticonvulsivantes (fenitoína, carbamazepina, barbitúricos, primidona, topiramato, oxcarbazepina); rifampicina y rifabutina.

### Anticonceptivos combinados
1. **Categoría 4:** lactancia y menos de 6 semanas posparto; menos de 21 días posparto con otros factores de riesgo de ETV; 35 años o más y fumadora de 15 o más cigarrillos al día (excepto inyectable, categoría 3); múltiples factores de riesgo cardiovascular arterial; PA sistólica ≥ 160 o diastólica ≥ 100; HTA con enfermedad vascular; historia de TVP/EP, TVP/EP actual o en tratamiento anticoagulante; cirugía mayor con inmovilización prolongada; mutaciones trombogénicas conocidas; cardiopatía isquémica; ACV; valvulopatía complicada; LES con anticuerpos antifosfolípidos positivos o desconocidos; migraña con aura a cualquier edad; migraña sin aura en 35 años o más (continuación); cáncer de mama actual; diabetes con nefropatía, retinopatía, neuropatía, otra enfermedad vascular o más de 20 años de evolución; adenoma hepatocelular; hepatoma maligno; hepatitis viral aguda o en exacerbación (orales, parches y anillos); cirrosis grave descompensada.
2. **Categoría 3:** 6 semanas a 6 meses posparto con lactancia; menos de 21 días posparto sin otros factores de riesgo de ETV; 21 a 42 días posparto con otros factores de riesgo de ETV; 35 años o más y fumadora de menos de 15 cigarrillos al día (orales, parches y anillos); 35 años o más y fumadora de 15 o más (inyectables); historia de HTA sin posibilidad de medir PA; HTA tratada y controlada con PA medible; PA sistólica 140 a 159 o diastólica 90 a 99; cefalea sin aura bajo 35 años (continuación); cefalea con aura en 35 años o más (inicio); cáncer de mama pasado sin evidencia de enfermedad por 5 años; enfermedad biliar actual o tratada médicamente, e historia de colestasia por AOC (orales, parches y anillos); hepatitis viral aguda o en exacerbación (inicio, solo inyectables); adenoma hepatocelular (solo inyectable); lamotrigina; otros anticonvulsivantes (fenitoína, carbamazepina, barbitúricos, primidona, topiramato, oxcarbazepina) para orales, parches y anillos; rifampicina o rifabutina.

### Dispositivos intrauterinos
1. **Categoría 4:** embarazo; posparto con sepsis puerperal; inmediatamente después de aborto séptico; sangrado vaginal de etiología desconocida antes de la evaluación (inicio); enfermedad trofoblástica gestacional con βhCG persistentemente elevada o enfermedad maligna; cáncer cervical en espera de tratamiento (inicio); cáncer de endometrio (inicio); fibromas con distorsión de la cavidad; anomalías anatómicas que distorsionen la cavidad e impidan la inserción; EIP actual; tuberculosis pélvica; cervicitis purulenta actual o infección por clamidia o gonorrea.
2. **Categoría 3:** entre 48 horas y 4 semanas posparto; LES con trombocitopenia severa; enfermedad trofoblástica con βhCG reducida o indetectable; cáncer de ovario (inicio); mayor riesgo de ITS (inicio); VIH severo o avanzado (inicio); terapia antirretroviral con ITRN, ITRNN, inhibidores de proteasa reforzados con ritonavir o raltegravir (inicio).

## Esterilización quirúrgica

:::flujo esterilizacion

### Antes de derivar (en APS)
- Consejería en APS y que la usuaria mantenga la solicitud. Si no la mantiene: anticoncepción en APS.
- Historia clínica, pesquisa de patologías (EMPA) y PAP vigente.
- Diabetes, hipertensión u obesidad (IMC > 35): compensación, derivando a programa Vida Sana o Cardiovascular según corresponda. Derivar cuando esté compensada y con IMC < 35; si no, anticoncepción en APS y reevaluar en 3 meses.
- Otras comorbilidades: compensación y especificarlas en la interconsulta.
- Iniciar anticoncepción en espera de la esterilización, reforzando LARC según criterios OMS.

### Criterio de derivación
- Solicitud de esterilización que se mantiene tras la consejería, sin comorbilidades o con comorbilidades compensadas e IMC < 35.

### Requisitos de la interconsulta (sin ellos no se acepta)
- IMC.
- Comorbilidades.
- Antecedentes gineco-obstétricos: paridad, mala historia obstétrica.
- Factores de riesgo para mal resultado obstétrico.
- Consentimiento de solicitud de esterilización firmado.
- PAP vigente.

### Prioridad P2
- La solicitud de esterilización no constituye P1.
- Se prioriza a usuarias con contraindicación de embarazo por patología médica materna, situación psicosocial de riesgo, mala historia obstétrica o comorbilidades de riesgo para embarazo. Estos antecedentes deben venir en la interconsulta.

### Contenidos de la consejería
1. La única indicación de anticoncepción permanente es la preferencia de la usuaria.
2. Mostrar la eficacia comparada con otros métodos (cartilla CDC). La esterilización tiene tasa de fracaso de 0,5%, comparable a vasectomía y LARC.
3. Las complicaciones inmediatas son raras (menos del 1%): anestesia, trauma visceral, infección, hematoma.
4. Aumentan el riesgo quirúrgico o anestésico, sin ser contraindicaciones absolutas: obesidad (IMC > 30), factores de riesgo de adherencias (cirugías previas, EIP) y comorbilidad significativa. En ellas se puede sugerir vasectomía de la pareja o LARC.
5. Establecer expectativas y enfatizar la irreversibilidad: la reversión quirúrgica o la fertilización asistida son de bajo rendimiento y acceso limitado en el sistema público.

:::calc imc esterilizacion

## Climaterio

:::flujo climaterio

### Criterios de derivación a Policlínico de Climaterio HBLT
- Mujer climatérica sintomática (MRS alterado o FRAX con riesgo alto de fractura) dentro de la ventana de oportunidad: no después de los 60 años o no después de 10 años de ocurrida la menopausia.
- Insuficiencia ovárica prematura: menopausia antes de los 40 años, excluida causa patológica de amenorrea.
- Menopausia secundaria (< 55 años), según el algoritmo.

### Prioridad P1
- Insuficiencia ovárica prematura.
- Complicaciones de la terapia hormonal (ver sección siguiente).

### No derivar
- Mujer climatérica sintomática fuera de la ventana de oportunidad: seguimiento en APS.

### Exámenes señalados en el algoritmo
- Mamografía actual.
- PAP.
- Perfil lipídico.
- Glicemia o hemoglobina glicosilada.
- TSH.
- FSH, solo en mujeres con duda de fertilidad.
- Exámenes específicos de comorbilidades.

> El algoritmo remite a un anexo de "ingreso a alta complejidad" que no está incluido en el documento.

:::calc climaterio

## Terapia hormonal de la menopausia

:::flujo thm

### Criterios de derivación si requiere terapia hormonal
- Hipertensión arterial descompensada o con daño de parénquima (según norma GES).
- Riesgo de enfermedad tromboembólica, o riesgo alto de enfermedad tromboembólica.
- Diabetes descompensada o con daño de parénquima (según norma GES).
- Antecedente de más de una trombosis venosa profunda.
- Antecedente familiar de trombosis o trombofilias diagnosticadas.
- Riesgo cardiovascular ATP-III > 3.
- Epilepsia en tratamiento.
- Antecedente personal de tumor o cáncer estrógeno o progesterona-dependiente (mama, endometrio, melanoma, colon, ovario de células claras, hepático, meningioma).
- Mesenquimopatías.
- Patología cervical (según norma GES).
- Depresión grave con síntomas psicóticos, alto riesgo suicida o refractariedad.

### Criterios de derivación en usuaria con THM de baja complejidad que presenta complicación
- Sangrado postmenopáusico recurrente.
- Falta de respuesta a terapia luego de probar 2 alternativas en 1 año.
- Reacción adversa severa a terapia hormonal.

**Destino:** Policlínico de Climaterio HBLT. Para terapia hormonal se requiere mamografía de menos de 1 año.

## Infertilidad

:::flujo infertilidad

### Criterios de derivación a Reproducción Humana (UGER)
- Edad 20 a 34 años 11 meses, con actividad sexual sin anticoncepción 2 a 3 veces por semana por 1 año, e IMC 18 a 31,9.
- Edad 35 a 41 años 11 meses, con actividad sexual sin anticoncepción 2 a 3 veces por semana por 6 meses, e IMC 18 a 31,9.
- Deseo de embarazo con antecedente de oligomenorrea, embarazo ectópico o esterilización quirúrgica, e IMC 18 a 31,9.

> El rango de IMC proviene de las Orientaciones Técnicas para el manejo de la infertilidad de baja complejidad, MINSAL 2013.

### No derivar
- IMC fuera del rango 18 a 31,9: continuar controles en APS.
- Sin el tiempo de exposición que corresponde a su tramo de edad: continuar controles en APS.

### Prioridad P1
- Endometriosis con dolor.
- Embarazada con lesión anexial.
- Lesión anexial benigna > 6 cm en edad fértil.
- Miomas sintomáticos en mujer en edad fértil.

### Requisitos de la interconsulta
- Breve historia y antecedentes de la mujer y del hombre.
- Talla y peso.
- PAP vigente.
- VDRL, VIH y VHB.
- Hemograma, perfil bioquímico y TSH.
- Ecografía transvaginal, si es posible de máximo 3 meses.

### A considerar
1. Mujeres sin pareja y parejas homoparentales femeninas: el programa ministerial de técnicas de reproducción asistida no las considera, por lo que deben financiar el costo de los procedimientos.

:::calc infertilidad

## Reversión de esterilización

**Entre 1% y 13% de las mujeres esterilizadas opta por revertir el procedimiento. La efectividad de la recanalización oscila entre 48% y 54%.**

### Antes de derivar
- Se recomienda no derivar a mayores de 42 años.
- Realizar consejería e idealmente no derivar si la esterilización fue por causa médica o por enfermedad en que el embarazo pone en riesgo la vida.
- Patología psiquiátrica: derivar con pase del psiquiatra tratante que informe explícitamente que no habría conflicto con la maternidad.
- VIH y/o VHB: derivar con pase de Infectología.
- Idealmente no derivar si no hay pareja masculina presente.

## Consideraciones previas a derivar a Reproducción Humana (UGER)

### Antes de derivar
- HTA, DM e hipotiroidismo: derivar con la patología compensada.
- Mesenquimopatías, cardiopatías, epilepsia o EPOC: derivar con pase del especialista pertinente.
- Neoplasias en general y ginecológicas: derivar con pase oncológico.
- Trastornos hereditarios: comunicarse con el Consultorio de Alto Riesgo Obstétrico y Perinatal para evaluar consejería prenatal.

## Prolapso de órganos pélvicos

:::flujo prolapso

### No derivar
- Prolapso asintomático: las interconsultas serán rechazadas.

### Síntomas que definen prolapso sintomático
1. Bulto genital, peso o presión.
2. Intestinales: defecación obstructiva.
3. Disfunción sexual: dificultad en la penetración.
4. Urinarios: latencia, chorro débil, pujo miccional, sensación de vaciamiento incompleto, intermitencia, goteo postmiccional, digitalización.

### Criterios de derivación a UPPF
- Prolapso sintomático estadio 3 (más de 1 cm bajo el anillo himeneal) o estadio 4 (procidencia).
- Prolapso sintomático estadio 1 o 2 cuyos síntomas persisten tras 1 año de cambios de estilo de vida en APS.

### Prioridad P1
- Prolapso estadio 4.
- Infecciones del tracto urinario a repetición.
- Uropatía obstructiva baja.

### Cambios de estilo de vida en APS (estadios 1 y 2)
1. Disminuir de peso (nutrición APS).
2. Ejercicios de piso pélvico (díptico del manual: al menos 2 a 3 veces por semana).
3. Manejo de EPOC o asma, constipación, obesidad (nutrición y médico APS) y tabaquismo.
4. Reevaluar en 1 año.

### Conducta en UPPF según el algoritmo
1. Manejo conservador con pesario: reevaluar pesario cada 3 a 4 meses; si falla o se rechaza, se considera manejo quirúrgico.
2. Con indicación quirúrgica e IMC < 35: cirugía.
3. Con indicación quirúrgica e IMC ≥ 35: derivar a nutricionista hasta cumplir meta de peso objetivo, con control anual en APS. En uropatía obstructiva baja o retención urinaria el algoritmo marca paso directo a cirugía.

### Requisitos: resumen de derivación a UPPF (adjuntar a la IC)
- G P A, uso de fórceps (sí o no) y peso máximo del RN.
- Detalle de cada parto: orden, vía, peso del RN y edad de la madre.
- Menarquia, menopausia y TRH (cuál y tiempo de uso).
- FUR, ritmo menstrual y MAC.
- Antecedentes mórbidos, fármacos, quirúrgicos, alergias y hábitos.
- Síntomas de prolapso marcados uno a uno.
- Peso, talla e IMC.
- Estadio POP-Q (no realizar grilla de 3x3, solo determinar estadio).
- Mamografía, ecografía mamaria, PAP y ecografía transvaginal con resultado y año.

### Estadios POP-Q
Basados en el descenso máximo respecto del anillo himeneal, en uno o más compartimentos, con Valsalva máxima de al menos 6 segundos.
1. **Estadio 0:** sin prolapso. Aa, Ba, Ap y Bp a -3 cm; C o D entre LVT y LVT-2.
2. **Estadio 1:** la porción más distal está a más de 1 cm sobre el himen (menos de -1 cm).
3. **Estadio 2:** la porción más distal está entre 1 cm sobre y 1 cm bajo el himen (entre -1 y +1 cm).
4. **Estadio 3:** la porción más distal está a más de 1 cm bajo el himen, pero a menos de 2 cm del LVT (LVT-2).
5. **Estadio 4:** procidencia genital o eversión de cúpula; la porción más distal protruye a más de LVT-2.

:::calc popq

## Incontinencia urinaria

:::flujo incontinencia

### Criterio de derivación a UPPF
- Pérdida de orina involuntaria al toser, hacer fuerza o algún esfuerzo, de 6 o más meses de evolución.

### Antes de derivar
- Infección urinaria descartada (urocultivo negativo con fecha).
- Diabetes compensada con HbA1c < 7.
- Uso correcto y adecuado de fármacos antidiuréticos en paciente con HTA.
- IMC < 35.

### Prioridad P1
- Test de Sandvik de 8 o más puntos, con IMC < 35.

### Requisitos de la SIC para no ser rechazada
- Especificar si existe o no pérdida de orina al esfuerzo, con puntaje del Test de Sandvik.
- Urgencia miccional, urgeincontinencia y climacturia.
- Frecuencia urinaria diurna y nocturna.
- Urocultivo negativo con fecha.
- HbA1c en pacientes diabéticas.
- Diuréticos: nombre del fármaco, dosis y horario de administración.
- PAP al día.

### Sin indicación de derivación a UPPF
1. Si no se cumplen las condiciones: tratamiento y compensación de patologías, ajuste de fármacos, manejo integral de la obesidad y reforzamiento de ejercicios de piso pélvico.

### Test de Sandvik
Puntaje = frecuencia (A) × cantidad (B).
1. **Frecuencia (A):** 1 = menos de 1 vez al mes; 2 = algunas veces al mes; 3 = algunas veces a la semana; 4 = todos los días o noches.
2. **Cantidad (B):** 1 = gotas (muy poco); 2 = chorro pequeño (moderado); 3 = chorro grande (mucha cantidad).

:::calc sandvik

## Síndrome de vejiga hiperactiva

:::flujo vejiga

### Criterio de derivación a UPPF
- Urgencia miccional (deseo miccional imperioso imposible de diferir) de 6 o más meses de evolución, que no mejora tras las medidas previas.

### Antes de derivar
- Infección urinaria descartada con urocultivo negativo.
- Diabetes compensada con HbA1c < 7.
- Uso correcto y adecuado de fármacos antidiuréticos en HTA (evaluar real necesidad de uso, dosis y horarios).
- Suspender irritantes vesicales por 3 meses: té, café, mate, bebidas cola, jugos cítricos y aliños picantes (ají, jengibre, merkén, pimienta, canela).
- Último líquido importante a las 19:00 horas.

### No derivar
- Mejoría con las medidas previas.

### Prioridad P1
- Uso de ayuda técnica para la marcha.
- Antecedente de caídas por desplazamiento en el último año.
- Persona > 65 años con deterioro importante de calidad de vida (aislamiento social, dermatitis vulvar recurrente, trastorno del ánimo depresivo, climacturia, etc.).
- Paciente de 18 a 35 años.

### Requisitos que debe señalar la interconsulta
- Si existe o no urgencia miccional, urgeincontinencia, pérdida de orina al esfuerzo y climacturia; frecuencia urinaria diurna y nocturna.
- Si usa ayuda técnica para desplazarse y si ha presentado caídas a nivel en el último año (indicar si fue evaluada por TO o KNT).
- Urocultivo negativo con fecha.
- HbA1c en pacientes diabéticas.
- Diuréticos: nombre del fármaco y horario de administración.
- PAP al día.

# 10. FISIATRÍA

**Fuente:** Manual de derivación ambulatoria a Fisiatría, DERIV 11, versión 1.

## Regla de acceso del manual

- Las derivaciones son solamente intrahospitalarias.
- Se aceptan derivaciones telefónicas de pacientes dados de alta.
- Se aceptan pacientes del Hospital Exequiel González Cortés con los diagnósticos señalados por el manual.

## P1 – Alta prioridad

- Enfermedad cerebrovascular / hemorragia intracerebral / hemorragia subaracnoidea / infarto cerebral, con el criterio temporal señalado por el manual para ACV <6 meses.
- Paraplejia y cuadriplejia.
- Hemiplejia y hemiparesia.
- Enfermedades de la médula espinal.
- Compresión medular.
- Compresión de raíces y plexos nerviosos en contexto consignado por el manual.
- Algoneurodistrofia / síndrome de dolor regional complejo.
- Traumatismo craneoencefálico.
- Gran quemado.
- Esclerosis lateral amiotrófica.

## P2 – Mediana prioridad

- Esclerosis múltiple.
- Polineuropatía y trastornos del sistema nervioso periférico.
- Enfermedades de motoneurona y de la unión neuromuscular.
- Parálisis cerebral y otras parálisis.
- Dermatomiositis.
- Miopatía no especificada.
- Miopatía inflamatoria.
- Dolor crónico intratable u otro dolor crónico que no haya respondido a tratamiento previo.
- Síndrome postlaminectomía.
- Síndrome de Guillain-Barré.
- Ausencia adquirida de miembros.
- Amputaciones traumáticas.
- Hombro congelado / capsulitis adhesiva.
- Trauma de nervios múltiples.
- Secuela traumática de nervios de miembro superior o inferior.
- Herpes zóster complicado.
- Neuralgia del trigémino.
- Artritis reumatoide, seropositiva/seronegativa o artritis idiopática juvenil cuando exista dolor crónico y limitación de actividades por discapacidad.
- Problemas relacionados con limitación de actividades por discapacidad.

## P3 – Baja prioridad

### Lumbago con ciática
- Derivar si no ha respondido a tratamiento previo.

### Fibromialgia
- Derivar si no ha respondido a tratamiento previo.

## Criterios de exclusión

- Patologías musculoesqueléticas agudas como tendinopatías, bursitis o meniscopatías.
- Dolor lumbar sin estudio de imágenes ni tratamiento inicial.
- Fibromialgia de reciente diagnóstico.

# 11. NEUROLOGÍA

**Fuente:** Manual de derivación ambulatoria a Neurología, DERIV 09, versión 1.

## Cefalea

### Derivación inmediata a Urgencia si existe una bandera roja
- Inicio súbito o cefalea descrita como la mayor de su vida.
- Inicio abrupto “en trueno”.
- Cefalea que impide realizar actividad cotidiana.
- Persistencia o aparición con esfuerzos como Valsalva, coito o tos.
- Focalidad neurológica.
- Compromiso de conciencia.
- Signos meníngeos.
- Edema de papila.
- Traumatismo encéfalo-craneano reciente, especialmente si es progresiva.

### Derivar a especialidad si no existen banderas rojas y se cumple alguno
- Inicio en mayores de 50 años sin historia previa de cefalea.
- Cambio de patrón de cefalea crónica.
- Nuevo déficit focal o hallazgo focal.
- Empeoramiento súbito refractario a analgesia habitual.
- Síntomas de alarma persistentes.

### Cefalea primaria / migraña / tensional
**Antes de derivar:**
- Uso de dosis y plazo adecuados de al menos 2 tratamientos profilácticos.

**Derivar si:**
- Fracaso del tratamiento profiláctico bien llevado por 3 meses.
- Contraindicación absoluta a fármacos de primera línea.

## Epilepsia

### Urgencia
- Status epiléptico.
- Crisis subintrantes sin recuperación de conciencia.
- Crisis en contexto de sospecha de intoxicación aguda o TEC grave.

### Derivar a especialidad si:
- Primera crisis o sospecha clínica fundada, una vez descartadas causas metabólicas/tóxicas según lo señalado por el manual.
- Casos especiales: embarazo, inmunosupresión o cáncer.
- Epilepsia conocida descompensada que no logra control pese a ajuste terapéutico.

### Priorizar si existe
- Antecedente de convulsiones o epilepsia asociada a tumores.
- Crisis convulsivas en embarazada.
- Crisis recurrentes.
- Sospecha de status.
- Descompensación de epilepsia sin gatillantes clásicos o conocidos.
- Crisis motoras recurrentes.

## Trastornos del movimiento

### Sospecha de Parkinson
**Derivar si existe cuadro compatible, incluyendo:**
- Temblor de reposo.
- Rigidez.
- Bradicinesia.
- Inicio asimétrico y progresión lenta.

**Derivar especialmente si:**
- Fracaso terapéutico.
- Duda diagnóstica.
- Incapacidad funcional severa.

### Otros trastornos extrapiramidales
**Derivar según cuadro señalado por el manual:**
- Distonías.
- Corea/tics complejos.
- Movimientos rápidos, azarosos o múltiples que interfieren la actividad.
- Sospecha etiológica de Huntington, Sydenham o Tourette.

## Accidente cerebrovascular

### Urgencia
- Déficit focal agudo <72 horas: derivación inmediata a Urgencias.
- No generar interconsulta ambulatoria.
- El manual destaca especialmente evolución <24 horas.

### Secuela no aguda
- Déficit establecido >72 horas: estudio ambulatorio o derivación a Neurología/Rehabilitación según funcionalidad.
- Manejo de factores de riesgo cardiovascular en APS.

## Neuropatías periféricas

### Urgencia
- Polineuropatía aguda compatible con Guillain-Barré u otra neuropatía aguda grave señalada por el manual.

### Polineuropatía diabética o por alcohol
- Iniciar estudio y manejo en APS.
- Derivar si existe fracaso del tratamiento farmacológico en dosis adecuadas.
- Derivar si existe atrofia/paresia o dolor intratable.

### Mononeuropatía múltiple / aguda
- Derivar ante sospecha de vasculitis o causa autoinmune.

## Tetraparesia o paraparesia flácida no traumática

### Priorizar si existe
- Pérdida de funcionalidad motora.
- Pérdida del control de esfínteres o retención urinaria.
- Pérdida de la marcha.
- Evolución menor a 1 mes.

### Excluir como causa nueva
- Secuelas de parálisis cerebral.
- Trauma raquimedular.
- ACV antiguo.

## Miopatía

- Derivar cuadro de debilidad motora con compromiso proximal o distal, luego de excluir otras causas indicadas por el manual.

## Miastenia gravis

**Cuadro señalado por el manual:**
- Debilidad y fatigabilidad fluctuante.
- Compromiso ocular, faríngeo o de extremidades.

## No derivar a Neurología según el manual

- Patología tumoral.
- Traumatismos craneales y sus secuelas.
- Lesiones vasculares como aneurismas o malformaciones arteriovenosas.
- Radiculopatías y lumbociática.
- Esas condiciones corresponden a Neurocirugía.
- Demencias: según la norma señalada en el manual, deben ser abordadas inicialmente por Psiquiatría.

## Requisito de la SIC

- Anamnesis.
- Hipótesis diagnóstica clara.
- Examen físico neurológico pertinente.
- Detalle del tratamiento previo realizado.

# 12. UROLOGÍA

**Fuente:** Manual de derivación ambulatoria a Urología, DERIV 04, versión 1.

## Prioridades

- **P1:** derivación y atención prioritaria, plazo <30 días.
- **P2:** mediana prioridad, plazo 30–90 días.

## Urolitiasis

### Derivar si:
- Cálculo renal o ureteral.
- Nefrolitiasis no obstructiva de tamaño relevante según tabla del manual.
- Uropatía obstructiva.
- Falla a tratamiento médico expulsivo con respaldo imagenológico.
- Litiasis en riñón único o trasplantado.

### Exámenes
- PieloTAC.
- Ecografía renal y vesical.
- Creatinina plasmática.

### Prioridad
- **P1:** obstrucción, dolor intratable o infección.
- **P2:** otros casos.

## Hiperplasia prostática benigna GES

### Derivar si:
- Síntomas del tracto urinario inferior moderados a severos.
- Falla a tratamiento médico inicial.
- Complicaciones:
  - retención urinaria;
  - litiasis vesical;
  - ITU recurrente.

### Exámenes
- PSA total.
- Ecografía vesicoprostática con residuo postmiccional.
- Creatinina plasmática.

### Prioridad
- P1.

## Fimosis

### Derivar si:
- Fimosis purulenta o que genera parafimosis.
- Balanitis recurrente.
- Falla a tratamiento con corticoides tópicos.

### Prioridad
- P2.

## Varicocele

### Derivar si:
- Varicocele sintomático con dolor o pesadez.
- Infertilidad en relación con varicocele clínico.
- Atrofia testicular asociada.

### Exámenes
- Ecografía testicular Doppler.
- Espermiograma si existe infertilidad.

### Prioridad
- P2.

## Hidrocele

### Derivar si:
- Hidrocele a tensión o sintomático.
- Duda diagnóstica con tumor testicular.

### Examen
- Ecografía testicular.

### Prioridad
- P2.

## Infecciones urinarias

### Derivar si:
- ITU recurrente, según frecuencia definida por el manual.
- Pielonefritis recurrente que no responde a tratamiento.
- Sospecha de anomalía anatómica.

### Exámenes
- Urocultivo y antibiograma reciente.
- Ecografía renal y vesical.

### Prioridad
- P2.

## Patología uretral

### Derivar si:
- Chorro miccional débil o filiforme.
- Antecedente de trauma uretral, ITS o instrumentación.
- Fístula urinaria.

### Exámenes
- Uroflujometría si está disponible.
- Ecografía vesical con residuo postmiccional.

### Prioridad
- P2.

## Neurourología y piso pélvico

### Derivar si:
- Incontinencia de orina que afecta calidad de vida.
- Incontinencia de esfuerzo, urgencia o mixta.
- Prolapso de órganos pélvicos sintomático.

### Exámenes
- Sedimento de orina y urocultivo.
- Diario miccional de 3 días.
- Ecografía vesical con residuo postmiccional.
- Ecografía abdominal.
- Creatinina plasmática.

### Prioridad
- P2.

## Andrología

### Derivar si:
- Disfunción eréctil que no responde a tratamiento inicial.
- Infertilidad masculina en estudio.
- Solicitud de esterilización quirúrgica por vasectomía.

### Exámenes
- ECG en disfunción eréctil.
- Perfil hormonal para infertilidad.
- Espermiograma x2 para infertilidad.

### Prioridad
- P2.

## Hematuria

### Derivar si:
- Hematuria macroscópica de origen no precisado.
- Hematuria microscópica persistente sin causa urológica/ginecológica evidente, según umbral señalado en el manual.

### Exámenes
- Ecografía renal y vesical.
- Sedimento de orina.
- Urocultivo.

### Prioridad
- P1 si macroscópica.
- P2 si microscópica.

## Patología renal benigna

### Derivar si:
- Hidronefrosis moderada a severa.
- Enfermedad renal crónica de posible causa urológica.

### Exámenes
- Ecografía renal y vesical.
- TAC de abdomen y pelvis con contraste.

### Prioridad
- P1.

## Tumores retroperitoneales

### Derivar si:
- Hallazgo de masa o tumor retroperitoneal en estudio de imagen.

### Exámenes
- TAC de abdomen y pelvis con contraste.
- Marcadores tumorales según sospecha.

### Prioridad
- P1.

## Reflujo vesicoureteral y uropatía obstructiva

### Derivar si:
- Diagnóstico de reflujo vesicoureteral en estudio.
- Infección urinaria recurrente.
- Litiasis o estenosis ureteral/pieloureteral señalada por el manual.

### Exámenes
- Ecografía renal y vesical.
- Cistouretrografía miccional para reflujo.
- PieloTAC o renograma diurético para obstrucción.

### Prioridad
- P1.

## Patología oncológica urológica

### Cáncer de próstata
**Derivar P1 si:**
- PSA alterado según criterio consignado por el manual.
- Tacto rectal sospechoso.
- Biopsia prostática positiva.

### Cáncer de vejiga
**Derivar P1 si:**
- Hematuria macroscópica.
- Hallazgo de tumor vesical en imagen o cistoscopia.

### Cáncer renal
**Derivar P1 si:**
- Masa renal en estudio de imagen.
- Hematuria macroscópica asociada según cuadro.

### Cáncer testicular
**Derivar P1/GES si:**
- Masa testicular palpable no dolorosa.
- Aumento de volumen testicular unilateral.

### Cáncer de pene
**Derivar P1 si:**
- Lesión ulcerada, nodular o exofítica que no cicatriza.
- Adenopatías inguinales sospechosas.

### Tumores suprarrenales
**Derivar P1 si:**
- Incidentaloma suprarrenal.
- Sospecha de hiperfunción hormonal señalada por el manual.

# 13. HEMATOLOGÍA

**Fuente:** Manual de derivación ambulatoria de Hematología, DERIV 01, versión 1.

## No ingresar a lista de espera: Urgencia

- Inestabilidad hemodinámica.
- Sangrado activo.
- Compromiso de conciencia.
- Shock séptico.
- Disnea grave.
- Dolor torácico.

## Canasta mínima universal

- Hemograma con fórmula y recuento plaquetario.
- Reticulocitos si existe anemia.
- Perfil bioquímico, función renal y perfil hepático.
- PCR/VHS según sospecha.
- LDH, proteínas totales y albúmina idealmente, según disponibilidad.
- Frotis de sangre periférica cuando exista citopenia, leucocitosis marcada, plaquetas muy bajas o sospecha de blastos.
- Cinética de fierro y vitamina B12 si están disponibles.

## Anemia

### Derivar para estudio si:
- Anemia no carencial que requiere identificación de causa etiológica.

### Derivar a Medicina Interna si:
- Anemia ferropénica sin respuesta a tratamiento oral por mínimo 12 semanas.
- Recurrencia de anemia ferropénica tras normalización de parámetros hematológicos.

### Urgencia
- Anemia severa con inestabilidad hemodinámica.
- Sangrado activo.

## Trastornos cuantitativos plaquetarios

### Derivar si:
- Trombocitopenia persistente con plaquetas <100.000/mm³ en controles seriados, descartando hiperesplenismo por daño hepático crónico con hipertensión portal.
- Descenso progresivo de plaquetas sin causa clínica evidente.
- Trombocitosis persistente >450.000/mm³, especialmente sin causa secundaria identificada y con sospecha de patología clonal mieloproliferativa.

## Trastornos eritrocitarios / poliglobulia

### Derivar si:
- Hb >16,5 en hombres y >16 en mujeres, persistente por al menos 6 meses.
- Especialmente cuando se requiere diferenciar causas secundarias de enfermedades primarias mieloproliferativas.

## Enfermedad trombótica venosa

### Derivar a Medicina Interna si existe:
- Trombosis venosa profunda recurrente.
- Trombosis en territorios atípicos:
  - sistema venoso cerebral;
  - vascular mesentérico;
  - vena porta;
  - vena hepática.
- Episodio trombótico en paciente menor de 30 años sin factores de riesgo identificables.
- Embolia pulmonar sin causa clara identificable o recurrente.
- Embarazada: prioridad alta.

### No derivar a Hematología
- Trombosis venosa profunda asociada a cáncer activo: derivar directamente a Oncología o Cuidados Paliativos.

## Adenopatías

### Si existe sospecha clínica o imagenológica de linfoma
- Derivar directamente a ruta GES Linfoma.

### Sospechar linfoma si:
- Adenopatías firmes, indoloras y persistentes por más de 4–6 semanas.
- Adenopatías asociadas a síntomas B.
- Adenopatías con crecimiento exponencial en menos de 1 mes.
- Adenopatías generalizadas.

# 14. CIRUGÍA DE TÓRAX

**Fuente:** Manual de derivación ambulatoria a Cirugía de Tórax, DERIV 15, versión 1.

## Nódulo pulmonar

### Derivar si:
- Tamaño ≥10 mm.
- Crecimiento documentado en imágenes seriadas.
- Alto riesgo: fumador / IPE >20, según el manual.
- Aspecto sospechoso:
  - espiculado;
  - hipercaptante en PET/CT.

### Estudio mínimo previo
- Radiografía de tórax con informe.
- TAC de tórax, idealmente con contraste.
- Hemograma.

## Masa pulmonar o mediastínica

### Derivar siempre si:
- Masa pulmonar >3 cm.
- Masa mediastínica con síntomas:
  - disnea;
  - disfagia;
  - dolor;
  - síndrome de vena cava superior.

### Previo a derivar
- TC de tórax.
- Laboratorio basal.

## Derrame pleural

### Derivar si:
- Derrame unilateral persistente >4 semanas sin causa clara.
- Derrame recurrente.
- Sospecha oncológica o TBC sin confirmación ni mejoría.

## Neumotórax

### Derivar si:
- Recurrente: ≥2 episodios.
- Persistente >5 días con fuga aérea.
- Neumotórax sintomático secundario a patología pulmonar de base.

## Deformidades de pared torácica

### Patologías
- Pectus excavatum.
- Pectus carinatum.

### Derivar si:
- Compromiso cardiorrespiratorio con disnea o intolerancia al ejercicio, acompañado de ecocardiografía y TAC de tórax con índice de Haller <3,25, tal como figura en el manual.
- Impacto psicológico severo, especialmente en adolescentes.

## Causas frecuentes de rechazo

- Derivación sin imágenes.
- Derrame pleural resuelto.
- Nódulo <6 mm sin factores de riesgo ni seguimiento.
- No adjuntar resultados que justifiquen la sospecha.

## La SIC debe indicar

- Motivo claro de derivación.
- Diagnóstico presuntivo.
- Hallazgos relevantes del examen físico.
- Resultados adjuntos.
- Clasificación de prioridad sugerida.
- Teléfono de contacto actualizado.

# 15. INMUNOLOGÍA

**Fuente:** Manual de derivación ambulatoria a Inmunología, DERIV 07, versión 1.

## Inmunodeficiencia primaria

### Sospechar y derivar ante infecciones recurrentes, graves o inusuales, especialmente:
- ≥4 otitis media en 1 año.
- ≥2 sinusitis en 1 año.
- ≥2 neumonías en 1 año.
- Uso de antibióticos orales >2 meses en 1 año con respuesta insatisfactoria.
- Necesidad de antibióticos parenterales para controlar infecciones.
- ≥2 infecciones sistémicas graves, incluyendo sepsis.
- Antecedentes familiares de inmunodeficiencia primaria.
- Abscesos profundos recurrentes en piel u órganos internos.
- Infecciones micóticas persistentes en piel o mucosas.
- Alteración de laboratorio inmunológico:
  - complemento bajo;
  - inmunoglobulinas bajo rango normal;
  - subpoblaciones linfocitarias alteradas.

### Signos de alarma
- Sepsis.
- Neumonía grave.
- Pérdida ponderal.
- Fiebre prolongada.
- Infecciones oportunistas.

## Alergia a fármacos

### Derivar si:
- Alergia documentada a uno o más fármacos.
- Sospecha de alergia a fármaco con historia clínica compatible y relación temporal clara entre exposición y reacción.
- Reacción grave previa:
  - Stevens-Johnson;
  - necrólisis epidérmica tóxica;
  - DRESS;
  - síndrome de hipersensibilidad;
  - anafilaxia;
  - compromiso multiorgánico.
- Necesidad de definir tolerancia a alternativas terapéuticas en patologías crónicas.

## Alergia alimentaria y a aditivos

### Sospechar y derivar si:
- Urticaria, angioedema, síntomas respiratorios o anafilaxia asociados a ingesta.
- Síntomas digestivos reproducibles tras ingesta, con sospecha de mecanismo inmunológico.
- Evidencia de sensibilización por IgE específica o pruebas cutáneas, cuando estén disponibles.

## Alergia al látex

### Derivar si:
- Síntomas cutáneos, respiratorios o sistémicos inmediatos en contexto de exposición a látex.
- Sensibilización demostrada a látex por prueba cutánea o IgE específica, con o sin síntomas, especialmente si requiere procedimientos médicos frecuentes.

## Alergia a picadura de himenópteros

### Derivar si:
- Anafilaxia documentada en contexto de picadura/mordedura.
- Reacción local extensa con edema y eritema >10 cm y duración >24 horas.

## Angioedema recurrente

### Derivar si:
- ≥2 episodios de angioedema y/o urticaria, con o sin desencadenantes claros.
- Angioedema recurrente con antecedente familiar de angioedema hereditario.

### Signos de alarma
- Compromiso de vía aérea.
- Dolor abdominal intenso.
- Síntomas sistémicos.

## Anafilaxia

### Criterios de sospecha del manual
- Compromiso agudo de piel y/o mucosas asociado a:
  - compromiso respiratorio; y/o
  - hipotensión PAS <90 mmHg o caída >30% respecto de basal; y/o
  - síntomas gastrointestinales significativos y persistentes.
- Antecedente de consulta en Urgencia con requerimiento de adrenalina para manejo de anafilaxia.
- Diagnóstico previo de anafilaxia que requiere indicación de autoinyector de adrenalina y plan de acción.

### Prioridad
- P1 según manejo inicial consignado por el manual.

## Urticaria crónica

### Derivar si:
- Urticaria que persiste o recurre por >6 semanas.

## Rinitis alérgica

### Derivar si:
- Rinitis persistente moderada a severa.
- Síntomas nasales >4 días/semana y >4 semanas.
- Compromiso de calidad de vida, sueño o rendimiento escolar/laboral.

## Exámenes mínimos recomendados en APS

- Hemograma completo.
- VHS/PCR.
- Función renal y hepática si usa fármacos potencialmente nefro/hepatotóxicos.
- Registro actualizado de vacunas.

# 16. NEFROLOGÍA

**Fuente:** Manual de derivación a la especialidad de Nefrología, DERIV 08, versión 1.

## Requisitos generales de la interconsulta

### Historia clínica
- Motivo de consulta y tiempo de evolución.
- HTA.
- DM2.
- Enfermedad cardiovascular.
- ERC previa.
- Litiasis.
- Infecciones urinarias.
- Uso crónico de AINE u otros nefrotóxicos.
- Antecedentes familiares de ERC o riñón único.

### Examen físico
- Presión arterial en al menos 2 controles.
- Peso.
- Talla.
- IMC.
- Signos de sobrecarga de volumen.
- Edema.
- Ingurgitación yugular.
- Masa palpable si corresponde.

### Exámenes mínimos
- Creatinina sérica y VFG CKD-EPI.
- Al menos 2 creatininas separadas por un mínimo de 3 meses para determinar ERC.
- Relación albúmina/creatinina o proteína/creatinina en orina.
- Alternativamente, proteinuria de 24 horas si laboratorio lo permite.
- Electrolitos.
- Glicemia.
- Perfil lipídico.
- HbA1c si diabético.
- Sedimento de orina.
- Otros exámenes señalados por el manual según contexto.
- Ecografía abdominal ideal, no excluyente.

### No pertinente si falta
- Creatinina/VFG.
- Estudio básico de orina.
- Al menos 2 controles de presión arterial.
- Creatinina cuando corresponda para evaluar cronicidad.

## P0 – Urgencia: no vía CNE

- Anuria u oliguria brusca <400 mL/24 h.
- Hiperkalemia ≥6,5 mEq/L.
- Edema agudo pulmonar, disnea en reposo o saturación baja.
- Elevación aguda marcada de creatinina, aumento ≥50% en <7 días compatible con IRA.
- Síndrome nefrítico según el criterio de urgencia descrito por el manual.

## P1 – Prioritario

- Proteinuria en rango nefrótico.
- ERC con VFG <30 mL/min/1,73 m² no GES o no codificada, según condición administrativa señalada por el manual.
- Deterioro rápido de función renal.
- Hematuria glomerular persistente con proteinuria.
- Síndrome nefrótico.
- Tubulopatía significativa.

## P2 – Mediana prioridad

- Patologías estables.
- Sin progresión rápida.
- Función renal conservada o lentamente disminuida.
- Sin criterios de P1.

## Proteinuria persistente No GES

### Derivar si existe proteinuria confirmada en ≥2 muestras separadas por al menos 3 meses y, pese a tratamiento máximo tolerado:
- Proteinuria ≥1 g/24 h.
- RPC ≥1000 mg/g.
- RAC ≥300 mg/g.
- Proteinuria moderada asociada a:
  - VFG <60 mL/min/1,73 m²;
  - HTA resistente;
  - hematuria glomerular concomitante.

### Exámenes mínimos
- Orina completa.
- RAC o RPC.
- Proteinuria de 24 horas si corresponde.
- Creatinina y VFG.
- Electrolitos.
- Perfil lipídico.
- Glicemia.
- Ecografía renal ideal.

### Tiempo de observación
- 3–6 meses de tratamiento optimizado y monitoreo, salvo criterios de P1.

## Síndrome nefrótico

### Criterios / hallazgos consignados
- Edema generalizado.
- Proteinuria en rango nefrótico ≥3,5 g/24 h o RPC ≥3500 mg/g.
- Hipoalbuminemia.
- Dislipidemia.

### Derivar si:
- Todo adulto con proteinuria en rango nefrótico, independiente de VFG.
- Edema significativo.
- Hipoalbuminemia.
- Dislipidemia marcada.

### Prioridad
- Habitualmente P1.

### Urgencia si:
- Disnea.
- Derrames masivos.
- Sospecha de trombosis de vena renal.

## Síndrome nefrítico

### Hallazgos consignados
- Hematuria.
- Hipertensión arterial o agravamiento de HTA.
- Edema.
- Oliguria.
- Posible deterioro de función renal.

### Exámenes mínimos
- Creatinina y VFG.
- Electrolitos.
- Hemograma.
- Albúmina sérica.
- Perfil lipídico.
- Orina completa con sedimento.
- Ecografía renal ideal.

### Conducta
- El manual señala que todo adulto con síndrome nefrítico se considera Urgencia por riesgo de caída brusca de VFG.
- También señala prioridad alta cuando el paciente está estable sin compromiso de función renal.

## Tubulopatía renal

### Derivar si existen alteraciones persistentes en ≥2 controles, como:
- Hipokalemia <3,0 mEq/L sin causa evidente.
- Acidosis metabólica hiperclorémica.
- Hipercalciuria, nefrocalcinosis o litiasis recurrente con sospecha de tubulopatía.
- Deterioro de función renal con VFG <60 mL/min/1,73 m² o creatinina sérica progresivamente ascendente.

### Exámenes mínimos
- Creatinina y VFG.
- Electrolitos.
- Orina completa.
- Osmometría venosa/urinaria si está disponible.
- Glicemia.
- Ecografía renal.

### Tiempo de observación
- 3–6 meses si el cuadro es leve y estable.
- Derivación P1 si existe compromiso importante de electrolitos o VFG.

# 17. BRONCOPULMONAR

**Fuente:** Manual derivación broncopulmonar.  
**Objetivo:** definir criterios de priorización de las interconsultas al servicio de Broncopulmonar Adulto HBLT para los establecimientos de la Red del SSMS.

## Prioridades

- **P0:** derivar a servicio de Urgencia.
- **P1 – Prioridad alta:** tiempo de respuesta menor de 1 mes.
- **P2 – Prioridad mediana:** tiempo de respuesta mayor de 1 mes y hasta 1 año.
- **P3 – Prioridad baja:** tiempo de respuesta mayor de 1 año.

## P0 – Urgencia

- Insuficiencia respiratoria aguda.
- Hemoptisis.

## Antecedentes recomendados en la interconsulta

- Hábito tabáquico.
- Exposición ocupacional.
- Uso y dosis de corticoides inhalados y sistémicos.
- Hallazgos relevantes del examen físico: peso, saturación, frecuencia respiratoria, examen físico pulmonar, presencia de acropaquia, cianosis y examen reumatológico.
- Cuestionarios validados, según corresponda: ACT o ACQ5 para asma, CAT para EPOC, STOP-BANG para AOS, puntaje TAI para adherencia a técnica inhalatoria, puntaje ESTI para técnica inhalatoria y escala de Borg o mMRC para disnea.
- Estado de vacunación neumocócica, influenza, COVID y DTPa.
- Espirometría.
- Hemograma con recuento de eosinófilos, test de caminata y radiografía de tórax, si están disponibles.

### Imágenes realizadas fuera del HBLT

- Las imágenes en CD deben cargarse en ventanilla 5, piso 1, antes de la consulta.
- Si la imagen está disponible en una página web, el paciente debe llevar las claves para su revisión durante la atención.

## EPOC (GES 38)

### Derivar P1 si:

- Disnea mMRC >2.
- Hematocrito >50%.
- SpO2 <92%.
- Uso de corticoides sistémicos por más de 1 mes, independientemente de la dosis.
- Hospitalización en el último año por exacerbación de EPOC.
- Más de 2 exacerbaciones de manejo ambulatorio en el año.
- VEF1 <50%.

### Exámenes para derivar

- Espirometría basal y posbroncodilatador obligatoria.
- Test de caminata de 6 minutos y radiografía de tórax, si se dispone en el centro.

## Asma (GES 61)

### Derivar P1 si:

- Persiste duda diagnóstica.
- No existe respuesta al tratamiento por 3 meses con salmeterol/fluticasona 100/1000 mcg/día, considerando ACT <20 puntos.
- Presenta 2 o más crisis anuales utilizando salmeterol/fluticasona 100/1000 mcg/día.
- Exacerbación que requirió VMI o paro cardiorrespiratorio.
- Asma no controlada durante el embarazo, definida en el manual como más de 1 exacerbación anual o ACT <20 puntos, con tratamiento.
- Asma e intolerancia a ácido acetilsalicílico o AINE.

### Examen para derivar

- Espirometría basal y posbroncodilatador obligatoria.

## Bronquiectasias

### Derivar P1 si:

- Más de 3 consultas a Urgencia en 6 meses.
- Más de 1 exacerbación que requiera hospitalización.
- Espirometría con VEF1 <50%.
- Sospecha clínica de fibrosis quística.

### Exámenes para derivar

- Espirometría basal y posbroncodilatador.
- PCR para TBC.
- Cultivo de expectoración opcional.

## Patología intersticial

### Derivación desde APS

- Sospecha clínica con espirometría restrictiva y/o imagen sugerente.

### Derivar P1 si:

- Desaturación en caminata de 6 minutos.
- CVF <40%.
- Saturación en reposo <90%.
- Caída de CVF >10% en 6 meses.

### Exámenes recomendados

- Espirometría.
- Test de caminata.
- Hemograma.
- VHS.
- Creatinina.
- Perfil hepático para inicio de antifibróticos.

### Derivación intra-CDT

- Sospecha clínica más escáner de tórax: P1.
- Control posterior a hospitalización por exacerbación de enfermedad pulmonar intersticial: P1.

## Hipertensión pulmonar

### Grupo I – P1 (Ley Ricarte Soto)

- Sospecha clínica: disnea de esfuerzo, síncope o limitación de la capacidad de ejercicio.
- Estudio sugerido: angio-TC de arteria pulmonar y ecocardiograma.

### Grupo IV – P1

- Sospecha clínica.
- Estudio sugerido: angio-TC, ecocardiograma, proBNP y troponina.

## Derrame pleural

- Ante derrame pleural unilateral, exudado mononuclear con ADA bajo o citología sugerente: activar GES 81.

## Cáncer pulmonar (GES 81)

### Antecedentes y criterios GES

- Incluir peso actual y performance status en la interconsulta.
- Activar GES ante derrame pleural unilateral, exudado mononuclear con ADA bajo o citología sugerente.
- Masa >3 cm.
- Nódulo >2 cm con factores de riesgo: IPA >20, edad >40 años o tabaquismo >40 años.
- Biopsia que evidencia cáncer de pulmón.

### Factores de riesgo consignados

- Edad mayor de 50 años.
- IPA ≥20, en fumador activo o exfumador desde hace menos de 10 años.

## Nódulo pulmonar sólido

- **>2 cm:** abrir caso GES.
- **Entre 1 y 2 cm con factores de riesgo:** derivar a Cirugía de Tórax, de acuerdo con flujograma local HBLT.
- **>0,8 y hasta 1 cm con factores de riesgo:** P1.
- **0,5–0,8 cm con factores de riesgo y crecimiento documentado:** P1.
- **0,5–0,8 cm sin factores de riesgo:** P2.
- **<0,5 cm:** P3.

## Nódulo pulmonar subsólido

- Aparición de componente sólido >2 mm: P1.
- Lesión en vidrio esmerilado persistente a los 3 meses: P1.
- **>2 cm:** abrir caso GES.
- **Entre 1 y 2 cm con factores de riesgo:** derivar a Cirugía de Tórax, de acuerdo con flujograma local HBLT.
- **>0,8 y hasta 1 cm con factores de riesgo:** P1.
- **0,5–0,8 cm con factores de riesgo y crecimiento documentado:** P1.
- **0,5–0,8 cm sin factores de riesgo:** P2.
- **<0,5 cm:** P3.

## Tuberculosis en mayores de 15 años

**Referencia indicada en el manual:** Norma Técnica 2022.

### Derivar P1 si:

- Duda diagnóstica.
- Toxicidad a fármacos o intolerancia.
- TBC extrapulmonar.
- Quimioprofilaxis en pacientes con VIH o inmunosupresión.
- Silicotuberculosis.
- Sospecha de TBC resistente.
- Segundo episodio de tuberculosis en pacientes antes tratados.
- Paciente con VIH y tuberculosis.
- Sospecha de fracaso de tratamiento.
- Micobacteria no TBC.

### Antecedentes imprescindibles para acudir al CDT

- PCR de pesquisa en casos presuntivos de tuberculosis pulmonar o baciloscopía BK de control de tratamiento actualizada del mes.
- Imágenes de tórax.
- Tarjetón de tratamiento.

## Neumonía

- Neumonía que requirió VMNI o VMI: P1.
- Neumonía de lenta resolución: P2.

## Apnea del sueño

### Antecedentes de la interconsulta

- STOP-BANG.
- Escala de Epworth.
- Riesgo ocupacional.

### Derivar P1 si:

- Accidentabilidad laboral, con o sin estudio de sueño.
- Sospecha de hipoventilación-obesidad: IMC >30 y GSA con PCO2 >45.
- Polisomnografía o poligrafía con IAH >30.
- CT90 >30%.

## Insuficiencia respiratoria crónica

- Ingreso a programa de oxigenoterapia ambulatoria: P1.
- Sospecha de patología restrictiva secundaria a enfermedad neuromuscular: P2.

## Pase operatorio por patología respiratoria

- Prioridad P1.

### La interconsulta debe incluir

- Diagnóstico de base y tratamiento.
- Sitio de la intervención y duración estimada del procedimiento.
- Hemograma, radiografía de tórax y espirometría basal y posbroncodilatador obligatoria.
- Gases arteriales si es usuario del programa de oxigenoterapia ambulatoria.

## Otros diagnósticos

- Tabaquismo (GES 90): derivar a APS.
- Tos crónica: P3.
- LCFA: P3.
- Hallazgo de imagen anormal de pulmón: P3.

# 18. MEDICINA INTERNA

**Fuente:** Protocolo de derivación a Medicina Interna y especialidades derivadas, diciembre de 2025.

## Objetivo y alcance

- Establecer criterios clínicos para la derivación a Medicina Interna o directamente a subespecialidades del HBLT.
- Aplica a médicos generales y médicos de atención secundaria que deriven pacientes de 15 años o más al HBLT.

## Vía habitual de derivación

- La derivación inicial debe realizarse a Medicina Interna según los criterios del protocolo, salvo los casos definidos para derivación directa a una subespecialidad.
- Los cuadros que comprometan la vida, la función orgánica o la estabilidad hemodinámica deben derivarse directamente a Urgencia, sin ingresar a lista de espera.

### Toda interconsulta debe sustentarse en:

- Diagnóstico presuntivo fundado.
- Evolución clínica documentada.
- Exámenes básicos completos según patología.
- Priorización clínica.

## Condiciones hematológicas para Medicina Interna

### Anemia

**Derivar a Medicina Interna si:**

- Requiere estudio para identificar la causa etiológica.
- Es ferropénica y no responde al tratamiento oral durante un mínimo de 12 semanas.
- Recurre después de una normalización previa de los parámetros hematológicos.

**Derivar a Urgencia si:**

- Anemia severa.
- Inestabilidad hemodinámica asociada.
- Sangrado activo.

### Trastornos cuantitativos plaquetarios

**Derivar si:**

- Trombocitopenia persistente con plaquetas <100.000/mm³ en controles seriados.
- Descenso progresivo de plaquetas sin causa clínica evidente.
- Trombocitosis persistente >450.000/mm³, especialmente sin causa secundaria identificada —infección, ferropenia o inflamación— y con sospecha de patología clonal mieloproliferativa.

### Poliglobulia

**Derivar si:**

- Hemoglobina >16,5 en hombres o >16 en mujeres.
- Especialmente si se requiere diferenciar causas secundarias —hipoxia crónica, tabaquismo, apnea del sueño o tumores productores de eritropoyetina— de enfermedades mieloproliferativas primarias.

### Enfermedad trombótica

**Derivar a Medicina Interna si:**

- Trombosis venosa profunda recurrente.
- Trombosis en territorios atípicos: sistema venoso cerebral, vascular mesentérico, vena porta o hepática.
- Episodio trombótico en menor de 30 años sin factores de riesgo identificables.
- Embolia pulmonar sin causa clara identificable o recurrente.

**Derivar directamente a Oncología o Cuidados Paliativos si:**

- Trombosis venosa profunda asociada a cáncer activo.

### Adenopatías

- Ante sospecha clínica o imagenológica de linfoma: derivar directamente a la ruta GES Linfoma.
- Sospechar linfoma ante adenopatías firmes, indoloras y persistentes por más de 4–6 semanas, o asociadas a síntomas B: fiebre prolongada sin foco, sudoración nocturna profusa o baja de peso involuntaria.

### Exámenes mínimos para estas condiciones

- Hemograma actualizado.
- Perfil bioquímico.
- Pruebas hepáticas.
- Función renal.
- Según la sospecha diagnóstica, se puede agregar serología para VIH y ecografía abdominal.

## Condiciones cardiológicas para Medicina Interna

### Arritmias

- La fibrilación auricular sin otros hallazgos de alta complejidad debe evaluarse inicialmente en Medicina Interna para comenzar manejo anticoagulante y control de frecuencia.

**Derivar directamente a Cardiología si:**

- Flutter auricular.
- Taquicardia supraventricular paroxística.
- Bradicardia sintomática.
- Bloqueo auriculoventricular de segundo o tercer grado.
- Extrasístole ventricular frecuente o compleja.
- Síndrome de Wolff-Parkinson-White.

### Insuficiencia cardíaca

- La insuficiencia cardíaca hipertensiva con fracción de eyección preservada debe manejarse inicialmente en Medicina Interna.

**Derivar directamente a Cardiología si:**

- Insuficiencia cardíaca con fracción de eyección reducida <45%.
- Miocardiopatía conocida de cualquier etiología.

### Síndrome coronario crónico o dolor torácico

- Angina sin estudio no invasivo previo: derivar a Medicina Interna para solicitar estudios iniciales de isquemia —test de esfuerzo, ecocardiografía, angio-TC coronario o score de calcio— según disponibilidad.

**Derivar directamente a Cardiología si:**

- Angina con estudio no invasivo positivo para isquemia.
- Coronariopatía documentada: IAM previo, stent coronario o enfermedad coronaria crónica establecida.

### Valvulopatías

- Las valvulopatías moderadas o severas documentadas por ecocardiografía deben derivarse directamente a Cardiología.

### Síncope

- Síncope sin estudio previo: derivar a Medicina Interna para solicitar estudios iniciales —Holter de ritmo y ecocardiograma—.

**Derivar directamente a Cardiología si:**

- Enfermedad del nodo sinusal con bradicardia sintomática documentada.
- Bloqueo AV de segundo grado.
- Bloqueo bifascicular sintomático.
- Bloqueo de rama alternante.

### Exámenes mínimos para estas condiciones

- Electrocardiograma.
- Perfil bioquímico.
- Pruebas hepáticas.
- Hemograma.
- TSH.
- Función renal.
- Según la sospecha y disponibilidad en APS, se puede agregar radiografía de tórax, Holter de ritmo o ecocardiograma.

## Condiciones gastroenterológicas para Medicina Interna

### Daño hepático crónico

- El daño hepático crónico sin causa identificada y sin complicaciones debe evaluarse inicialmente en Medicina Interna.

**Derivar a Gastroenterología si existe:**

- Ascitis.
- Encefalopatía hepática.
- Hemorragia digestiva alta por hipertensión portal.
- Ictericia persistente.
- Trombocitopenia secundaria a hipertensión portal.
- Hepatitis viral crónica B o C.

### Elevación persistente de transaminasas sin causa clara

- Derivar a Medicina Interna para estudio estructurado y escalonado de causas metabólicas, autoinmunes, virales, farmacológicas y genéticas.

### Diarrea crónica

- Diarrea por más de 4 semanas asociada a elementos patológicos, disentería, mucosidad o esteatorrea, con coprocultivo y parasitológico negativos: derivar inicialmente a Medicina Interna.
- Ante alta sospecha clínica o evidencia imagenológica de enfermedad inflamatoria intestinal: derivar a Gastroenterología.
- Ante sospecha clínica o imagenológica de neoplasia de colon: derivar directamente a la ruta GES de cáncer de colon.

### Dolor abdominal crónico

- Dolor abdominal por más de 2 meses, sin causa evidente o con síntomas persistentes: derivar a Medicina Interna.
- Activar GES de cáncer gástrico ante síntomas de alarma digestiva: dispepsia de inicio después de los 40 años, dispepsia refractaria al tratamiento inicial o cualquier hallazgo clínico o imagenológico sugerente de neoplasia gástrica.

### Exámenes mínimos para estas condiciones

- Perfil bioquímico.
- Pruebas hepáticas.
- Hemograma.
- Función renal.
- Según la sospecha y disponibilidad en APS, se puede agregar ecografía abdominal, virus hepatotropos, coprocultivo o parasitológico.

## Condiciones nefrológicas y metabólicas para Medicina Interna

- Enfermedad renal crónica etapa 3: derivar mediante GES de prevención de enfermedad renal crónica terminal.
- Enfermedad renal crónica con proteinuria >500 o RAC >300 de forma persistente: derivar mediante GES de prevención de enfermedad renal crónica terminal.
- Hipertensión arterial resistente —3 o más fármacos, incluido un diurético, con adecuada adherencia farmacológica y no farmacológica—: derivar mediante GES de hipertensión arterial.
- Sospecha de hipertensión arterial secundaria —asimetría renal, empeoramiento de función renal con IECA/ARA2, diagnóstico en jóvenes o adultos mayores, hipokalemia, entre otros—: derivar mediante GES de hipertensión arterial.
- Sospecha de hipertensión arterial secundaria de origen endocrinológico: derivar directamente a Endocrinología.
- Enfermedad renal crónica etapa 4–5: derivar directamente a Nefrología.
- Hiponatremia leve o moderada crónica: derivar a Medicina Interna.
- Hipercalcemia leve o moderada crónica: derivar a Medicina Interna.

### Derivación inmediata a Urgencia

- Oliguria o anuria aguda.
- Elevación brusca de creatinina >50% en días o semanas.
- Edema pulmonar.
- Hiperkalemia severa >6,5 mEq/L.

### Exámenes mínimos para estas condiciones

- Perfil bioquímico.
- Pruebas hepáticas.
- Hemograma.
- Función renal.
- Según la sospecha y disponibilidad en APS, se puede agregar ecografía renal y pelviana.

## Medicina Interna General

### Derivar si:

- Síndrome consuntivo sin causa identificada.
- Fiebre persistente sin etiología evidente o fiebre prolongada sin foco.

### Exámenes mínimos

- Perfil bioquímico.
- Pruebas hepáticas.
- Hemograma.
- VHS.
- Función renal.
