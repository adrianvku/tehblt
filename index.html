# 19. ONCOLOGÍA

**Fuente:** Manual de derivación ambulatoria a la especialidad de Oncología, código DERIV 11, versión 1, aprobado en abril de 2026, vigente hasta abril de 2031.

## Objetivo y alcance

- Establecer criterios técnicos y administrativos para la derivación, priorización y gestión de interconsultas hacia Oncología Médica.
- Aplica a derivaciones intrahospitalarias y a la gestión de pacientes provenientes del extrasistema que requieran inicio o continuidad de tratamiento oncológico.

## Regla general para tumores sólidos

- El diagnóstico y la etapificación corresponden a la especialidad tratante.
- El ingreso a Oncología para tratamiento sistémico requiere presentación previa en Comité Oncológico.
- Todo paciente derivado debe contar con diagnóstico por biopsia, etapificación vigente menor de 3 meses y evaluación previa en el Comité Oncológico correspondiente.
- La presentación en comité es obligatoria para validar la conducta terapéutica y realizar posteriormente la derivación a Oncología.
- El caso debe ser inscrito en el comité correspondiente y presentado por un médico de staff.

### Antecedentes para presentar el caso en Comité Oncológico

- Informe médico completo.
- Diagnóstico confirmado mediante biopsia.
- Etapificación actualizada, idealmente con una antigüedad no superior a 3 meses.

## Comités Oncológicos de tumores sólidos

El manual señala que existen 6 comités, pero enumera los siguientes 5:

- Ginecología Oncológica.
- Patología Mamaria.
- Broncopulmonar / Cirugía de Tórax.
- Uro-oncología.
- Neurocirugía Oncológica.

- Los casos que no correspondan a estas áreas deben evaluarse en el Comité Oncológico General.
- Los horarios y la forma de inscripción deben consultarse directamente en los servicios clínicos correspondientes.

## Excepciones al requisito de biopsia

### Hepatocarcinoma

- Puede diagnosticarse sin biopsia en pacientes con cirrosis o alto riesgo cuando exista un patrón típico en TAC o RM: realce arterial y *washout*.
- La biopsia se reserva para casos atípicos.

### Cáncer testicular con riesgo vital

- Puede iniciarse tratamiento sin biopsia cuando exista diagnóstico clínico e imagenológico concordante.
- Requiere aval del Comité Oncológico.

## Derivación intrahospitalaria ambulatoria desde CDT

### Requisitos

- Interconsulta emitida por el médico tratante después de la presentación en Comité Oncológico.
- Adjuntar antecedentes clínicos relevantes, incluyendo diagnóstico, etapa de la enfermedad e información relacionada con el paciente.

### Priorización y gestión de la hora

- La priorización se realiza con base en criterios clínicos y en la resolución del Comité Oncológico.
- Si el comité indica terapia sistémica, el Jefe de Centro valida la pertinencia de la interconsulta en el sistema.
- Las interconsultas sin respaldo de Comité Oncológico son evaluadas por el médico contralor de la unidad.
- Si no cumplen los criterios, se devuelven a la especialidad de origen para presentación en comité y posterior reingreso.
- Las interconsultas pertinentes se envían a Admisión para notificar al usuario y asignar hora según la priorización clínica.

## Derivación intrahospitalaria desde Atención Cerrada

- El médico tratante de sala debe presentar previamente al paciente en el Comité Oncológico correspondiente.
- La presentación previa en comité es obligatoria.
- El caso debe inscribirse y presentarse con informe médico completo, diagnóstico confirmado por biopsia y etapificación actualizada, idealmente de 3 meses o menos.
- Si el equipo tratante de sala no corresponde a la especialidad de la patología, el manual sugiere considerar la opinión previa de dicha especialidad antes de presentar el caso en comité.

## Derivación desde extrasistema como segundo prestador

### Ruta de ingreso

- El paciente que reingresa desde un segundo prestador con indicación de continuidad de tratamiento sistémico o cambio de línea terapéutica no cubierta por la canasta GES debe ingresar mediante la Unidad de Gestión Oncológica.
- La pertinencia clínica se evalúa junto con el Jefe de Centro y el Jefe de Servicio.
- En esta instancia se define la priorización y la asignación de hora en la especialidad correspondiente o en Oncología Médica.
- La solicitud puede originarse por presentación del propio paciente en la unidad o por derivación del Departamento GES.
- Si se requiere hora de ingreso, debe solicitarse al médico de la red la emisión u homologación de la interconsulta para su gestión conforme a la lista de espera institucional.

### Antecedentes requeridos

- Epicrisis.
- Informe de biopsia.
- Estudios de imagen actualizados.
- Tratamientos oncológicos previos.
- Registro de Comité Oncológico, si existe.

## Derivación ambulatoria desde extrasistema no segundo prestador o MLE

### Paciente que ya inició tratamiento oncológico

- Puede reingresar mediante la Unidad de Gestión de Casos Oncológicos.
- La pertinencia clínica se evalúa junto con el Jefe de Centro y el Jefe de Servicio, quienes definen la priorización y la asignación de hora.
- Posteriormente, la Unidad de Gestión de la Red debe evaluar la pertinencia administrativa según el sector y el per cápita del usuario y gestionar una interconsulta dirigida a Oncología.
- Antes de asignar hora deben solicitarse epicrisis, informe de biopsia, estudios de imagen y tratamiento actual.

### Paciente en proceso de estudio oncológico

- Debe ingresar obligatoriamente a la especialidad correspondiente.
- Posteriormente debe presentarse en el Comité Oncológico respectivo.

## Paciente hospitalizado en extrasistema no segundo prestador o MLE

- El traslado de un paciente hospitalizado que requiere iniciar o continuar tratamiento sistémico debe coordinarse mediante la Unidad de Gestión de Pacientes del HBLT.
- Esta unidad solicita apoyo a Gestión de Casos Oncológicos para presentar el caso al Jefe de Servicio y al Jefe de Centro de Oncología.
- Se evalúa la pertinencia de rescate a una sala de complejidad para iniciar o continuar el tratamiento, o se designa el rescate por la especialidad correspondiente para continuar con presentación en comité e inicio de tratamiento hospitalizado.

## Situaciones frecuentes y conducta

### Biopsia positiva sin etapificación

- Derivar a la especialidad correspondiente.

### Biopsia positiva con etapificación, sin indicación de tratamiento sistémico por comité externo

- Derivar a la especialidad correspondiente.

### Biopsia positiva con indicación de tratamiento sistémico por comité externo

- Derivar a la especialidad correspondiente / Oncología.
- Requiere presentación previa del caso al jefe médico de Oncología y su aprobación.

### Biopsia positiva con etapificación y dudas sobre la conducta a seguir en paciente hospitalizado cuyo equipo no es el tratante de la especialidad

- Derivar a la especialidad correspondiente.
- En paralelo, el caso puede presentarse en Comité Oncológico.

### Biopsia positiva con etapificación para iniciar tratamiento sistémico o localizado en Oncología o Radioterapia INC

- Presentar en Comité Oncológico.

### Paciente que inició tratamiento oncológico en extrasistema, de forma ambulatoria particular o durante hospitalización por Ley de Urgencia

- Derivar a la especialidad correspondiente / Oncología.
- Requiere presentación previa del caso al jefe médico de Oncología y su aprobación.

### Paciente que terminó tratamiento oncológico y recibe indicación de seguimiento por Oncología en extrasistema

- Consultar al jefe médico de Oncología si el seguimiento es pertinente.
- Si no es pertinente, derivar a la especialidad correspondiente.

## Flujo institucional desde CDT u hospitalización

1. Paciente con biopsia positiva y requerimiento de inicio de tratamiento sistémico indicado por la especialidad.
2. Presentación en Comité Oncológico con informe médico e imágenes vigentes por menos de 3 meses.
3. El comité puede indicar derivación a otra especialidad, solicitar nueva presentación si falta información o indicar derivación a Oncología Médica.
4. Si indica Oncología Médica, emitir interconsulta.
5. El médico contralor evalúa y corrobora la pertinencia.
6. Se asigna hora de ingreso a Oncología.

# 20. CUIDADOS PALIATIVOS ONCOLÓGICOS

**Fuente:** Manual de derivación ambulatoria a la especialidad de Cuidados Paliativos Oncológicos, código DERIV 11, versión 1, aprobado en abril de 2026, vigente hasta abril de 2031.

## Objetivo y alcance

- Establecer criterios técnicos y administrativos para la derivación, priorización y gestión de interconsultas a Cuidados Paliativos Oncológicos.
- Incluye derivaciones intrahospitalarias, equipos clínicos y administrativos de todos los niveles de atención y pacientes provenientes del extrasistema.

## Criterios generales de derivación

La derivación debe fundamentarse en necesidades paliativas de un paciente oncológico, tales como:

- Enfermedad oncológica avanzada o incurable.
- Síntomas complejos: dolor, disnea, náuseas refractarias, delirium, entre otros.
- Deterioro funcional progresivo.

### Requisito diagnóstico general

- El paciente debe contar con diagnóstico oncológico confirmado mediante biopsia.

### Excepciones

- Paciente en situación de fin de vida.
- Paciente en proceso diagnóstico con alta sospecha clínica de cáncer por imágenes y respaldo de Comité Oncológico.

## Derivación intrahospitalaria ambulatoria desde CDT

### Documentos y antecedentes requeridos

- Interconsulta emitida por el médico tratante.
- Informe de Proceso Diagnóstico correspondiente.
- Ambos documentos deben emitirse mediante el sistema electrónico institucional.
- Adjuntar diagnóstico, etapa de la enfermedad, tratamientos recibidos y motivo de derivación.

### Flujo

- Puede derivarse desde cualquier especialidad médica.
- La presentación en Comité Oncológico no es un requisito excluyente.
- El médico contralor de la unidad evalúa la pertinencia clínica.
- Las interconsultas pertinentes se envían a Admisión para notificación y asignación de hora según prioridad clínica.

### Priorización

- Carga sintomática.
- Deterioro funcional.
- Necesidad de soporte paliativo.
- Debe resguardarse la garantía GES, procurando el ingreso dentro de un plazo máximo de 5 días desde la confirmación del problema de salud.

## Derivación de paciente hospitalizado

### Criterios

El médico tratante de sala puede derivar sin presentación previa en Comité Oncológico. Se priorizan pacientes con cáncer que presenten:

- Síntomas no controlados.
- Alta carga de sufrimiento físico, psicológico o espiritual.
- Necesidad de adecuar los objetivos terapéuticos.
- Necesidad de planificar el alta con continuidad de Cuidados Paliativos Oncológicos en el nivel ambulatorio o domiciliario.

### Requisito diagnóstico y excepciones

- Como criterio general, se requiere diagnóstico oncológico confirmado mediante biopsia.
- Se exceptúan los pacientes en situación de fin de vida.
- También se exceptúan los pacientes en proceso diagnóstico con alta sospecha clínica de cáncer por imágenes y respaldo de Comité Oncológico.

### Documentos y antecedentes requeridos

- Interconsulta emitida por el médico tratante.
- Informe de Proceso Diagnóstico correspondiente.
- Ambos documentos pueden emitirse mediante el sistema electrónico institucional o en formato físico.
- Adjuntar diagnóstico, etapa de la enfermedad, tratamientos recibidos y motivo de derivación.

### Paciente ya ingresado en Cuidados Paliativos Oncológicos y hospitalizado

- El manejo sintomático corresponde al equipo médico tratante de sala.
- Si requiere escalamiento terapéutico o fármacos no disponibles en el arsenal del servicio, puede generarse una interconsulta para evaluación por el médico especialista de Cuidados Paliativos Oncológicos.

### Flujo y plazos

- La derivación puede originarse desde cualquier especialidad médica sin que el comité sea requisito excluyente.
- El médico contralor de la unidad define la pertinencia clínica.
- Para pacientes nuevos, la prioridad se determina por carga sintomática, deterioro funcional y necesidad de soporte paliativo.
- Se debe procurar el ingreso a la unidad dentro de un máximo de 5 días desde la confirmación del problema de salud.
- Para pacientes ya ingresados en la unidad que se encuentren hospitalizados, se asigna visita a sala dentro de 48 a 72 horas.

## Derivación desde extrasistema

### Ruta general

- El paciente que inició estudio o tratamiento fuera del establecimiento y requiere evaluación para ingresar a Cuidados Paliativos Oncológicos debe canalizarse mediante la Unidad de Gestión Oncológica.
- Esta unidad consolida los antecedentes clínicos disponibles y coordina con la Unidad de Gestión de Red la evaluación administrativa y la emisión de la interconsulta hacia la especialidad correspondiente.
- La especialidad médica correspondiente evalúa la pertinencia de la derivación a Cuidados Paliativos Oncológicos y determina el ingreso.

### Antecedentes que debe consolidar la Unidad de Gestión Oncológica

- Epicrisis.
- Biopsia.
- Imágenes.
- Registros de comités.
- Tratamientos.
- Otros antecedentes clínicos disponibles.

### Excepción para paciente en fin de vida

- La Unidad de Gestión de Casos gestiona la interconsulta junto con la Unidad de Gestión de Red.
- La Unidad de Cuidados Paliativos Oncológicos completa el Informe de Proceso Diagnóstico y la Constancia GES.

### Priorización

- Se basa en carga sintomática, deterioro funcional y necesidad de soporte paliativo.
- Las interconsultas pertinentes se envían a Admisión para notificación y asignación de hora.
- Se debe procurar el ingreso dentro de un plazo máximo de 5 días desde la confirmación del problema de salud.

## Flujo resumido de derivación

### Paciente en proceso diagnóstico intrahospitalario

1. Presentación en Comité Oncológico.
2. Validación de la indicación de derivación a Cuidados Paliativos Oncológicos.
3. Derivación a Cuidados Paliativos Oncológicos.
4. El médico tratante emite interconsulta e Informe de Proceso Diagnóstico.
5. El médico contralor revisa la documentación.
6. Se asigna hora de ingreso.

### Paciente intrahospitalario con diagnóstico confirmado

1. La especialidad deriva a Cuidados Paliativos Oncológicos.
2. El médico tratante emite interconsulta e Informe de Proceso Diagnóstico.
3. El médico contralor revisa la documentación.
4. Se asigna hora de ingreso.

### Paciente derivado desde extrasistema

1. Ingreso mediante el Equipo de Gestión de Casos Oncológicos.
2. Adjuntar antecedentes, informes médicos, biopsia e imágenes.
3. El gestor determina si el paciente está en proceso de fin de vida.
4. Si no está en fin de vida: no se encuentra confirmado como paciente en fin de vida y se solicita a Gestión de la Red una interconsulta a la especialidad.
5. Si está en fin de vida: se solicita a Gestión de la Red una interconsulta a Cuidados Paliativos Oncológicos.
6. El gestor presenta el caso al médico contralor de Cuidados Paliativos Oncológicos.
7. Se otorga hora de ingreso.

function render(lines, rx){
  let out = '';
  const st = [];        // listas abiertas: {tag, ind}
  let liOpen = false;   // hay un <li> sin cerrar en el nivel más profundo
  const hl = s => rx ? s.replace(rx,'<mark>$1</mark>') : s;
  const closeItem = () => { if(liOpen){ out += '</li>'; liOpen = false; } };
  const closeAll = () => {
    closeItem();
    while(st.length){ out += `</${st.pop().tag}>`; if(st.length) out += '</li>'; }
  };
  const item = (tag, ind, html) => {
    if(!st.length){ out += `<${tag}>`; st.push({tag, ind}); }
    else if(ind > st[st.length-1].ind){          // sublista: va dentro del <li> abierto
      out += `<${tag}>`; st.push({tag, ind}); liOpen = false;
    } else {
      closeItem();
      while(st.length > 1 && ind < st[st.length-1].ind){
        out += `</${st.pop().tag}>`; out += '</li>';
      }
      if(st[st.length-1].tag !== tag){
        out += `</${st.pop().tag}>`; out += `<${tag}>`; st.push({tag, ind});
      }
    }
    out += `<li>${html}`; liOpen = true;
  };
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ closeAll(); continue; }
    if(/^---+$/.test(line)){ closeAll(); out += '<hr>'; continue; }
    let m;
    if((m = line.match(/^:::flujo\s+(\S+)$/))){ closeAll(); out += `<div class="flujo" data-flujo="${esc(m[1])}"></div>`; continue; }
    if((m = line.match(/^:::calc\s+(.+)$/))){ closeAll(); out += `<div class="calc" data-calc="${esc(m[1].trim())}"></div>`; continue; }
    if((m = line.match(/^###\s+(.*)$/))){ closeAll(); out += `<h3>${hl(inline(m[1]))}</h3>`; continue; }
    if((m = line.match(/^>\s?(.*)$/))){ closeAll(); out += `<blockquote>${hl(inline(m[1]))}</blockquote>`; continue; }
    if((m = raw.match(/^(\s*)[-*]\s+(.*)$/))){
      item('ul', m[1].replace(/\t/g,'  ').length, hl(inline(m[2]))); continue;
    }
    if((m = raw.match(/^(\s*)\d+\.\s+(.*)$/))){
      item('ol', m[1].replace(/\t/g,'  ').length, hl(inline(m[2]))); continue;
    }
    closeAll(); out += `<p>${hl(inline(line))}</p>`;
  }
  closeAll(); return out;
}

/* distancia de edición acotada: tolera un error de tipeo en palabras largas */
function near(a, b){
  if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, d = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++d > 1) return false;
    if(a.length > b.length) i++;
    else if(a.length < b.length) j++;
    else { i++; j++; }
  }
  return d + (a.length - i) + (b.length - j) <= 1;
}

  }
  return false;

    const origen = lab && sub ? `${sub} · ${lab}` : (sub || lab || sec.title);
    if(!k){ p.libres.push(...its.map(i => ({t:i, s:origen}))); }
    else if(k === 'pri'){

    if((m = raw.trim().match(/^\*\*(.+?)\*\*:?\s*$/))){

      if(t.length < 120){ flush(); lab = t; continue; }

        <label>Exámenes con fecha y resultado</label><textarea data-f="lab" style="min-height:70px"></textarea></div></div>
      <div class="frow"><div class="fld" style="flex-basis:100%">
        <label>Comorbilidades y fármacos en uso</label><textarea data-f="com" style="min-height:56px"></textarea></div></div>
      <div class="tact"><button class="btn pri" data-act="sic">Copiar texto de la SIC</button>
        <button class="btn" data-act="prev">Ver texto</button></div>
      <pre class="sicout" data-out hidden></pre>
    </div>
  </div>`;
}

function wireTools(sp, sec, root){
  const d = toolsData(sp, sec), p = d.p;
  const pick = k => [...root.querySelectorAll(`input[data-k="${k}"]`)]
      .map((el,i) => el.checked ? d[k][i] : null).filter(Boolean);
  const miss = k => [...root.querySelectorAll(`input[data-k="${k}"]`)]
      .map((el,i) => el.checked ? null : d[k][i]).filter(Boolean);

  root.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    root.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    root.querySelectorAll('.tp').forEach(x => x.hidden = x.dataset.p !== b.dataset.tab);
  });

  const verd = root.querySelector('[data-verd]');
  const btnVer = root.querySelector('[data-act="ver"]');
  if(btnVer){
    btnVer.onclick = () => {
      const u = pick('urg'), c = pick('cri'), a = miss('aps'), e = miss('exa');
      const li = arr => '<ul>' + arr.map(o => `<li>${inline(o.t)}</li>`).join('') + '</ul>';
      let cls, tit, cuerpo;
      if(u.length){
        cls = 'v-urg'; tit = 'No corresponde interconsulta ambulatoria';
        cuerpo = `El manual excluye esta situación de la derivación ambulatoria por:${li(u)}
          Siga la vía que el manual indica para estos casos.`;
      } else if(!c.length && d.cri.length){
        cls = 'v-no'; tit = 'Sin criterio explícito de derivación';
        cuerpo = `No se marcó ninguno de los criterios que el manual enumera en esta sección.
          Si el caso no calza con ninguno, la SIC quedaría sin fundamento en el manual y es probable que se devuelva.`;
      } else if(a.length){
        cls = 'v-falta'; tit = 'Falta el manejo previo que exige el manual';
        cuerpo = `Hay criterio de derivación, pero antes el manual pide:${li(a)}`;
      } else if(e.length){
        cls = 'v-falta'; tit = 'Pertinente, pero falta respaldo';
        cuerpo = `El criterio se cumple. Quedan pendientes estos antecedentes que el manual solicita:${li(e)}
          Se puede derivar igual, pero la SIC llega incompleta y puede volver.`;
      } else {
        cls = 'v-ok'; tit = 'Derivación pertinente según el manual';
        cuerpo = `Se cumple criterio de derivación y están los antecedentes que el manual pide.${c.length ? li(c) : ''}`;
      }
      const pr = p.pri.length ? `<div class="vp"><b>Prioridad según el manual</b><ul>${p.pri.map(t => `<li>${inline(t)}</li>`).join('')}</ul></div>` : '';
      verd.className = 'verd on ' + cls;
      verd.innerHTML = `<h5>${tit}</h5>${cuerpo}${pr}
        <div class="vsrc">${esc(sp.name)} · ${esc(sec.title)}${sp.src ? ' · ' + esc(sp.src) : ''}</div>`;
    };
    root.querySelector('[data-act="reset"]').onclick = () => {
      root.querySelectorAll('.tchk input').forEach(i => i.checked = false);
      verd.className = 'verd'; verd.innerHTML = '';
    };
  }

  const f = k => { const el = root.querySelector(`[data-f="${k}"]`); return el ? el.value.trim() : ''; };
  function sicText(){
    const c = pick('cri'), e = pick('exa'), a = pick('aps');
    const pr = f('pri') === 'Según manual' ? 'según criterio del manual' : f('pri');
    const L = [];
    L.push(`INTERCONSULTA A ${sp.name.toUpperCase()}`);
    L.push(`Motivo: ${sec.title}`);
    L.push('');
    L.push(`Hipótesis diagnóstica: ${f('dx') || sec.title}${f('cie') ? ` (CIE-10 ${f('cie')})` : ''}`);
    if(f('evo')) L.push(`Tiempo de evolución: ${f('evo')}`);
    L.push('');
    L.push('Fundamento de la derivación según el manual vigente:');
    (c.length ? c.map(o => o.t) : ['(marcar el criterio en la pestaña de pertinencia)']).forEach(t => L.push(`- ${t}`));
    if(a.length){ L.push(''); L.push('Manejo previo realizado, según exige el manual:'); a.forEach(o => L.push(`- ${o.t}`)); }
    if(f('mng')){ L.push(''); L.push('Manejo y respuesta:'); L.push(f('mng')); }
    L.push('');
    L.push('Exámenes y antecedentes adjuntos:');
    if(e.length) e.forEach(o => L.push(`- ${o.t.replace(/\.$/,'')}: `));
    if(f('lab')) L.push(f('lab'));
    if(!e.length && !f('lab')) L.push('- (completar)');
    if(f('com')){ L.push(''); L.push(`Comorbilidades y fármacos: ${f('com')}`); }
    L.push('');
    L.push(`Prioridad propuesta: ${pr}`);
    if(f('pri') === 'Según manual' && p.pri.length) p.pri.forEach(t => L.push(`  ${t}`));
    L.push(`Referencia: ${sp.src || sp.name} · sección "${sec.title}"`);
    return L.join('\n');
  }
  const out = root.querySelector('[data-out]');
  root.querySelector('[data-act="prev"]').onclick = () => { out.hidden = false; out.textContent = sicText(); };
  root.querySelector('[data-act="sic"]').onclick = async () => {
    const t = sicText(); out.hidden = false; out.textContent = t;
    let hecho = false;
    try{ await navigator.clipboard.writeText(t); hecho = true; }
    catch(err){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); try{ hecho = document.execCommand('copy'); }catch(e2){} ta.remove(); }
    const b = root.querySelector('[data-act="sic"]'); const o = b.textContent;
    b.textContent = hecho ? 'Texto copiado' : 'Copie desde el recuadro';
    setTimeout(() => b.textContent = o, 2000);
  };
}


/* ---------------- calculadoras embebidas (bloques ":::calc nombre [contexto]" en el markdown) ----------------
   Cada calculadora aplica solo los cortes que el manual escribe. Cuando el manual no define
   una conducta, la calculadora lo dice en vez de completarla. */
const CALC_SRC = 'Ginecología · SCOG 24 v1';
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const f1 = n => n.toFixed(1).replace('.', ',');
const cIn = (k, lab, ph, w) => `<div class="fld"${w ? ` style="flex:0 1 ${w}px"` : ''}><label>${lab}</label><input data-c="${k}" inputmode="decimal" placeholder="${ph || ''}"></div>`;
const cSel = (k, lab, opts) => `<div class="fld"><label>${lab}</label><select data-c="${k}">${opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`;
const cChk = (k, lab) => `<label class="tchk"><input type="checkbox" data-c="${k}"><span>${lab}</span></label>`;
function cBox(tit, sub, body){
  return `<div class="calc-in"><div class="calc-h"><b>${tit}</b><span>${sub}</span></div>${body}<div class="calc-out" data-out></div></div>`;
}
function cOut(root, cls, tit, html){
  const o = root.querySelector('[data-out]');
  if(!cls){ o.className = 'calc-out'; o.innerHTML = ''; return; }
  o.className = 'calc-out verd on ' + cls;
  o.innerHTML = `<h5>${tit}</h5>${html}<div class="vsrc">${CALC_SRC}</div>`;
}
const cv = (root, k) => { const el = root.querySelector(`[data-c="${k}"]`); return !el ? null : el.type === 'checkbox' ? el.checked : el.value; };
function imcDe(root){
  const p = num(cv(root,'peso')), t = num(cv(root,'talla'));
  if(p && t){ const m = t > 3 ? t/100 : t; return Math.round(p/(m*m)*10)/10; }
  return null;
}
const pesoTalla = () => `<div class="frow">${cIn('peso','Peso (kg)','Ej: 68',160)}${cIn('talla','Talla (cm)','Ej: 158',160)}<div class="fld calc-imc" style="flex:0 1 160px"><label>IMC</label><div data-imc>—</div></div></div>`;

/* Escala visual de IMC: bandas según los cortes del manual para el contexto elegido */
const BANDAS = {
  infertilidad:[{a:15,b:18,c:'no',t:'< 18'},{a:18,b:32,c:'ok',t:'18 a 31,9 deriva'},{a:32,b:45,c:'no',t:'≥ 32'}],
  esterilizacion:[{a:15,b:30,c:'ok',t:'< 30'},{a:30,b:35,c:'mid',t:'> 30 más riesgo quirúrgico'},{a:35,b:45,c:'no',t:'> 35 compensar antes'}],
  prolapso:[{a:15,b:35,c:'ok',t:'< 35 cirugía'},{a:35,b:45,c:'no',t:'≥ 35 nutricionista'}],
  incontinencia:[{a:15,b:35,c:'ok',t:'< 35 cumple'},{a:35,b:45,c:'no',t:'≥ 35 no deriva'}],
  endometrio:[{a:15,b:25,c:'ok',t:'< 25 sin OR'},{a:25,b:30,c:'mid',t:'OR 1,5'},{a:30,b:35,c:'mid',t:'OR 2,5'},{a:35,b:40,c:'no',t:'OR 4,5'},{a:40,b:45,c:'no',t:'OR 7,1'}]
};
function escala(ctx, imc){
  const B = BANDAS[ctx]; if(!B) return '';
  const pos = v => Math.max(0, Math.min(100, (v-15)/30*100));
  return `<div class="esc">${B.map(b => `<div class="eb e-${b.c}" style="left:${pos(b.a)}%;width:${pos(b.b)-pos(b.a)}%"><span>${b.t}</span></div>`).join('')}
    ${imc ? `<div class="emk" style="left:${pos(imc)}%"><i>${f1(imc)}</i></div>` : ''}</div>
    <div class="esc-ax"><span>15</span><span>25</span><span>35</span><span>45</span></div>`;
}
/* Filas: qué dice el manual en cada patología para un IMC dado. st: ok | no | mid | na */
function filasIMC(imc){
  const r = [];
  r.push({id:'infertilidad', p:'Infertilidad', c:'Deriva a UGER con IMC 18 a 31,9',
    st: imc == null ? 'na' : (imc >= 18 && imc <= 31.9 ? 'ok' : 'no'),
    d: imc == null ? '' : (imc >= 18 && imc <= 31.9 ? 'Dentro del rango' : 'Fuera del rango: continuar controles en APS')});
  r.push({id:'esterilizacion', p:'Esterilización', c:'IMC > 35: compensar y derivar con IMC < 35. IMC > 30 aumenta el riesgo quirúrgico (no contraindica)',
    st: imc == null ? 'na' : imc < 35 ? (imc > 30 ? 'mid' : 'ok') : imc > 35 ? 'no' : 'na',
    d: imc == null ? '' : imc < 35 ? (imc > 30 ? 'Derivable; mencionar en consejería el mayor riesgo quirúrgico' : 'Derivable') : (imc > 35 ? 'Compensar en APS y reevaluar en 3 meses' : 'IMC exactamente 35: el manual no define este valor')});
  r.push({id:'prolapso', p:'Prolapso con indicación quirúrgica', c:'IMC ≥ 35: nutricionista hasta meta de peso. IMC < 35: cirugía',
    st: imc == null ? 'na' : imc < 35 ? 'ok' : 'no',
    d: imc == null ? '' : imc < 35 ? 'Puede ir a cirugía' : 'Nutricionista hasta meta de peso objetivo'});
  r.push({id:'incontinencia', p:'Incontinencia urinaria', c:'Requisito IMC < 35 (también para P1 por Sandvik)',
    st: imc == null ? 'na' : imc < 35 ? 'ok' : 'no',
    d: imc == null ? '' : imc < 35 ? 'Cumple' : 'Sin indicación de derivación a UPPF'});
  const orI = imc == null ? null : imc >= 40 ? '7,1' : imc >= 35 ? '4,5' : imc >= 30 ? '2,5' : imc >= 25 ? '1,5' : null;
  const orII = imc == null ? null : imc >= 40 ? '3,1' : imc >= 35 ? '2,2' : imc >= 30 ? '1,7' : imc >= 25 ? '1,2' : null;
  r.push({id:'endometrio', p:'Riesgo de cáncer de endometrio', c:'Tabla de OR por tramo de IMC',
    st: imc == null ? 'na' : orI ? 'mid' : 'ok',
    d: imc == null ? '' : orI ? `OR ${orI} (tipo I) y ${orII} (tipo II)` : 'Bajo 25: la tabla no asigna OR'});
  r.push({id:'obesidad', p:'"Obesidad" como factor de riesgo (SUA, pólipo endometrial)', c:'El manual no define corte de IMC',
    st:'na', d: imc == null ? '' : 'Criterio clínico: el manual no fija el valor'});
  return r;
}
const CALCS = {
  imc:{
    html: ctx => cBox('IMC según el manual', ctx && BANDAS[ctx] ? 'Escala con los cortes de esta patología' : 'Cortes de IMC que usa el SCOG 24', `${pesoTalla()}
      ${ctx && BANDAS[ctx] ? `<div data-esc>${escala(ctx, null)}</div>` : ''}<div data-tbl></div>`),
    wire(root, ctx){
      const go = () => {
        const imc = imcDe(root);
        root.querySelector('[data-imc]').textContent = imc ? f1(imc) : '—';
        const e = root.querySelector('[data-esc]'); if(e) e.innerHTML = escala(ctx, imc);
        const rows = filasIMC(imc);
        const ic = {ok:'Cumple', no:'No cumple', mid:'Atención', na:'—'};
        root.querySelector('[data-tbl]').innerHTML = `<div class="crows">${rows.map(r => `<div class="crow ${r.id === ctx ? 'here' : ''}">
            <div class="cp"><b>${r.p}</b><span>${r.c}</span></div>
            <div class="cr"><span class="st st-${r.st}">${ic[r.st]}</span>${r.d ? `<span>${r.d}</span>` : ''}</div></div>`).join('')}</div>`;
      };
      root.addEventListener('input', go); go();
    }
  },
  sandvik:{
    html: () => cBox('Test de Sandvik', 'Puntaje = frecuencia × cantidad', `<div class="frow">
      ${cSel('a','Frecuencia (A)',[['','Elegir'],['1','1 · menos de 1 vez al mes'],['2','2 · algunas veces al mes'],['3','3 · algunas veces a la semana'],['4','4 · todos los días o noches']])}
      ${cSel('b','Cantidad (B)',[['','Elegir'],['1','1 · gotas'],['2','2 · chorro pequeño'],['3','3 · chorro grande']])}</div>
      ${pesoTalla()}`),
    wire(root){
      const go = () => {
        const imc = imcDe(root); root.querySelector('[data-imc]').textContent = imc ? f1(imc) : '—';
        const a = +cv(root,'a'), b = +cv(root,'b');
        if(!a || !b) return cOut(root);
        const s = a*b, pt = `<p>Puntaje <b>${s}</b> de 12.</p>`;
        if(imc != null && imc >= 35) return cOut(root,'v-no','Sin indicación de derivación a UPPF', pt + `<p>El manual exige IMC < 35. Corresponde manejo integral de la obesidad, compensación de patologías y ejercicios de piso pélvico.</p>`);
        if(s >= 8) return cOut(root, imc == null ? 'v-falta' : 'v-ok', imc == null ? 'P1 si el IMC es menor a 35' : 'P1 según el manual', pt + `<p>Sandvik de 8 o más${imc == null ? '. Falta peso y talla para confirmar el IMC < 35.' : ' con IMC < 35.'}</p>`);
        return cOut(root,'v-falta','Sin criterio P1', pt + `<p>Bajo 8 puntos. Si cumple el resto de las condiciones (6 meses o más, urocultivo negativo, HbA1c < 7, fármacos ajustados, IMC < 35) se deriva sin prioridad alta.</p>`);

  },
  popq:{
    html: () => cBox('Prolapso: estadio POP-Q y conducta', 'Según el flujograma del manual', `<div class="frow">
      ${cSel('sin','¿Es sintomático?',[['','Elegir'],['si','Sí'],['no','No']])}
      ${cSel('e','Estadio POP-Q',[['','Elegir'],['0','0 · sin prolapso'],['1','1 · más de 1 cm sobre el himen'],['2','2 · entre 1 cm sobre y 1 cm bajo el himen'],['3','3 · más de 1 cm bajo el himen'],['4','4 · procidencia o eversión de cúpula']])}</div>
      <div class="frow">${cChk('anio','Estadio 1 o 2: síntomas persisten tras 1 año de cambios de estilo de vida')}</div>
      <div class="frow">${cChk('itu','ITU a repetición')}${cChk('uro','Uropatía obstructiva baja')}</div>`),
    wire(root){
      const go = () => {
        const s = cv(root,'sin'), e = cv(root,'e'), y = cv(root,'anio'), p1x = cv(root,'itu') || cv(root,'uro');
        if(!s) return cOut(root);
        if(s === 'no') return cOut(root,'v-no','No derivar','<p>Prolapso asintomático: el manual indica que estas interconsultas serán rechazadas.</p>');
        if(e === '') return cOut(root);
        if(e === '0') return cOut(root,'v-no','Estadio 0','<p>Sin prolapso según POP-Q. El algoritmo no contempla este caso; revisar la causa de los síntomas.</p>');
        const pri = e === '4' || p1x;
        const prTxt = pri ? `<p><b>P1</b>: ${[e === '4' ? 'estadio 4' : '', cv(root,'itu') ? 'ITU a repetición' : '', cv(root,'uro') ? 'uropatía obstructiva baja' : ''].filter(Boolean).join(', ')}.</p>` : '';
        if(e === '3' || e === '4') return cOut(root,'v-ok','Derivar a UPPF', `<p>Prolapso sintomático estadio ${e}.</p>${prTxt}<p>Adjuntar el resumen de derivación a UPPF con IMC y estadio.</p>`);

        if(pri) return cOut(root,'v-falta','Revisar', `<p>Estadio ${e}: el algoritmo indica cambios de estilo de vida y reevaluar en 1 año, pero el manual asigna P1 a ITU a repetición y uropatía obstructiva baja. La combinación no está explicitada en el flujograma.</p>`);
        return cOut(root,'v-falta','Manejo en APS primero', `<p>Estadio ${e}: bajar de peso, ejercicios de piso pélvico, manejo de EPOC o asma, constipación, obesidad y tabaquismo. Reevaluar en 1 año; si los síntomas persisten, derivar a UPPF.</p>`);
      };
      root.addEventListener('change', go); go();
    }
  },
  endometrio:{
    html: () => cBox('Endometrio en postmenopáusica', 'Espesor ecográfico, síntomas y factores de riesgo', `<div class="frow">
      ${cSel('sang','¿Sangrado uterino?',[['','Elegir'],['si','Sí'],['no','No']])}
      ${cIn('mm','Espesor endometrial (mm)','Ej: 7',200)}</div>
      <p class="sm2" style="margin:12px 0 4px">Factores de riesgo de la tabla del manual:</p>
      <div class="cgrid">${['Edad creciente (la tabla no fija umbral)','Terapia de estrógenos sin oposición','Tamoxifeno','Menopausia tardía (después de los 55)','Nuliparidad','SOP / anovulación crónica','Obesidad','Diabetes mellitus','Tumor secretor de estrógenos','Síndrome de Lynch','Síndrome de Cowden','Antecedente familiar de cáncer de endometrio, ovario, mama o colon','Menarquia temprana'].map((t,i) => cChk('fr'+i, t)).join('')}</div>`),
    wire(root){

        if(mm >= 4) return cOut(root,'v-no','Sin criterio de derivación en el algoritmo',`<p>Endometrio de ${f1(mm)} mm sin factores de riesgo marcados. El manual no consigna conducta explícita para este caso.</p>`);
        return cOut(root,'v-no','Sin criterio de derivación en el algoritmo',`<p>Endometrio bajo 4 mm en asintomática: el manual no consigna conducta.</p>`);
      };
      root.addEventListener('input', go); root.addEventListener('change', go); go();
    }
  },
  polipo:{
    html: () => cBox('Pólipo endometrial', 'Recorrido completo del flujograma', `<div class="frow">
      ${cIn('hb','Hemoglobina','Ej: 11,2',160)}${cSel('meno','Estado menopáusico',[['','Elegir'],['post','Postmenopáusica'],['pre','Premenopáusica']])}
      ${cSel('sint','Síntomas',[['','Elegir'],['no','Sin síntomas'],['sua','Sangrado uterino anormal'],['inf','Sin sangrado, con infertilidad y deseo de embarazo']])}</div>
      <div class="frow">${cChk('anes','Anemia sintomática')}${cChk('pers','El sangrado persiste tras manejo inicial en APS (control a los 3 a 6 meses)')}</div>
      <p class="sm2" style="margin:12px 0 4px">Factores de riesgo del algoritmo:</p>
      <div class="cgrid">${['Pólipo > 20 mm','Hipertensión arterial','Diabetes mellitus','Obesidad','Uso de tamoxifeno'].map((t,i) => cChk('fr'+i,t)).join('')}</div>`),
    wire(root){
      const go = () => {
        const hb = num(cv(root,'hb')), anes = cv(root,'anes');
        if(hb != null && (hb < 7 || (hb <= 10 && anes)))
          return cOut(root,'v-urg','Derivar a Urgencia Maternidad HBLT', `<p>${hb < 7 ? 'Anemia severa (Hb < 7)' : 'Anemia moderada sintomática (Hb 7 a 10)'}.</p>`);
        const m = cv(root,'meno'), s = cv(root,'sint');
        if(m === 'post') return cOut(root,'v-ok','Derivar a Ginecología · P1','<p>Usuaria postmenopáusica, con o sin síntomas.</p>');
        if(m !== 'pre' || !s) return cOut(root);
        if(s === 'sua') return cv(root,'pers')
          ? cOut(root,'v-ok','Derivar a Ginecología','<p>Sangrado persistente tras manejo inicial en APS. El manual no consigna prioridad.</p>')
          : cOut(root,'v-falta','Manejo inicial en APS','<p>AOC, progestágenos solos o DIU medicado según criterios OMS, con control clínico a los 3 a 6 meses. Si el sangrado persiste, derivar a Ginecología.</p>');
        if(s === 'inf') return cOut(root,'v-ok','Derivar a UGER','<p>Pólipo con infertilidad y deseo de fertilidad actual. El manual no consigna prioridad.</p>');

  anexial:{

      <div class="cgrid">${[['b0','a. Quiste unilocular > 5 cm'],['b1','b. Quiste multilocular'],['b2','c. Pared irregular, papila o componente sólido'],['d','d. Bilateral'],['e','e. Sólido'],['f','f. Doppler alto flujo (score 3 a 4)'],['g','g. Ascitis']].map(x => cChk(x[0],x[1])).join('')}</div>
      <div class="frow">${cSel('est','CA-125: estado',[['','Sin CA-125'],['pre50','Premenopausia, 50 años o menos'],['pre51','Premenopausia, más de 50 años'],['post','Postmenopausia']])}${cIn('ca','CA-125 (UI/mL)','Ej: 48',180)}</div>

        const est = cv(root,'est'), ca = num(cv(root,'ca'));
        const lim = {pre50:200, pre51:100, post:35}[est];
        const h = lim && ca != null && ca >= lim;
        const caTxt = lim && ca != null ? `<p>CA-125 ${f1(ca)} UI/mL; normal bajo ${lim} para este grupo: <b>${h ? 'elevado' : 'normal'}</b>.</p>` : '';
        const onc = ['d','e','f','g'].filter(k => cv(root,k)).map(k => root.querySelector(`[data-c="${k}"]`).nextElementSibling.textContent);
        if(h) onc.push('h. CA-125 elevado');
        const gen = ['b0','b1','b2'].filter(k => cv(root,k)).map(k => root.querySelector(`[data-c="${k}"]`).nextElementSibling.textContent);
        if(onc.length) return cOut(root,'v-ok','Categoría B · P1 · Oncoginecología',`${caTxt}<ul>${onc.concat(gen).map(t => `<li>${t}</li>`).join('')}</ul><p>La SIC debe incluir morbilidades crónicas, IMC, síntomas actuales y último PAP.</p>`);

        if(cv(root,'c')) return cOut(root,'v-falta','Categoría C · P2 · Ginecología General CABL',`${caTxt}<p>Síntomas persistentes tras el control ecográfico en APS, sin criterios A ni B.</p>`);
        const algo = root.querySelectorAll('[data-c]:checked').length || ca != null;
        return algo ? cOut(root,'v-no','Controlar en APS',`${caTxt}<p>Sin criterios A ni B: ecografía de control en 6 a 12 semanas. Derivar si persisten los síntomas o aparecen elementos B.</p>`) : cOut(root);
      };

  infertilidad:{
    html: () => cBox('Infertilidad', 'Edad, tiempo de exposición e IMC', `<div class="frow">
      ${cIn('ea','Edad (años)','Ej: 33',140)}${cIn('em','Meses adicionales','0 a 11',140)}${cIn('t','Meses sin anticoncepción, 2 a 3 v/sem','Ej: 14',240)}</div>

    wire(root){
      const go = () => {
        const imc = imcDe(root); root.querySelector('[data-imc]').textContent = imc ? f1(imc) : '—';
        const a = num(cv(root,'ea')), mo = num(cv(root,'em')) || 0, t = num(cv(root,'t')), ant = cv(root,'ant');
        if(a == null) return cOut(root);
        const edad = a + mo/12;
        let tramo = null, req = null;
        if(edad >= 20 && edad < 35){ tramo = '20 a 34 años 11 meses'; req = 12; }
        else if(edad >= 35 && edad < 42){ tramo = '35 a 41 años 11 meses'; req = 6; }
        const porTiempo = tramo && t != null && t >= req;
        if(!tramo && !ant) return cOut(root,'v-no','Fuera de los tramos del algoritmo','<p>El flujograma considera de 20 a 41 años 11 meses. Para otras edades el manual no define conducta.</p>');
        if(!porTiempo && !ant){
          if(t == null) return cOut(root);
          return cOut(root,'v-no','Continuar controles en APS',`<p>Tramo ${tramo}: requiere ${req} meses de exposición; lleva ${t}.</p>`);
        }
        const motivo = porTiempo ? `Tramo ${tramo} con ${t} meses de exposición (mínimo ${req}).` : 'Deseo de embarazo con antecedente de oligomenorrea, ectópico o esterilización.';
        const rev = ant && edad >= 42 ? '<p>Si se trata de reversión de esterilización, el manual recomienda no derivar a mayores de 42 años.</p>' : '';
        if(imc == null) return cOut(root,'v-falta','Falta el IMC',`<p>${motivo}</p><p>El algoritmo exige IMC 18 a 31,9 antes de derivar. Ingrese peso y talla.</p>${rev}`);
        if(imc >= 18 && imc <= 31.9) return cOut(root,'v-ok','Derivar a Reproducción Humana (UGER)',`<p>${motivo}</p><p>IMC ${f1(imc)}, dentro de 18 a 31,9.</p>${rev}`);
        return cOut(root,'v-no','Continuar controles en APS',`<p>${motivo}</p><p>IMC ${f1(imc)}, fuera del rango 18 a 31,9 que exige el algoritmo (OT MINSAL 2013).</p>${rev}`);
      };
      root.addEventListener('input', go); root.addEventListener('change', go); go();
    }
  },
  climaterio:{
    html: () => cBox('Climaterio', 'Ventana de oportunidad e insuficiencia ovárica prematura', `<div class="frow">

        if(cv(root,'sec')) return cOut(root,'v-ok','Derivar a Policlínico de Climaterio HBLT','<p>Menopausia secundaria: el algoritmo deriva a todas.</p>');
        if(e == null || m == null) return cOut(root);
        const anios = e - m, dentro = e <= 60 || anios <= 10;
        const vtxt = `<p>Edad ${e} años, ${anios} años desde la menopausia: <b>${dentro ? 'dentro' : 'fuera'}</b> de la ventana (no después de los 60 años o de 10 años desde la menopausia).</p>`;
        if(!cv(root,'sint')) return cOut(root,'v-no','Sin criterio de derivación', vtxt + '<p>El algoritmo deriva a la mujer climatérica sintomática (MRS alterado o FRAX alto).</p>');
        return dentro ? cOut(root,'v-ok','Derivar a Policlínico de Climaterio HBLT', vtxt) : cOut(root,'v-no','Seguimiento en APS', vtxt);
      };
      root.addEventListener('input', go); root.addEventListener('change', go); go();
    }
  }
};

function fNode(n){
  if(!n) return '';
  const tag = n.k === 'end' ? `<em>${FCLS[n.c] || ''}</em>` : '';
  const box = `<div class="fn fn-${n.k} ${n.c ? 'fc-' + n.c : ''}">${tag}${esc(n.t)}</div>`;
  const AR = `<div class="farw"><div class="far"></div></div>`;
  let side = '', below = '';
  if(n.br){
    const leaf = n.br.filter(([,c]) => c.k === 'end'), rest = n.br.filter(([,c]) => c.k !== 'end');
    {
      side = leaf.length ? `<div class="fside">${leaf.map(([l, c]) => `<div class="fsi"><span class="fh"><span class="flab">${esc(l)}</span></span>${fNode(c)}</div>`).join('')}</div>` : '';
      if(rest.length === 1) below = AR + `<div class="farw"><span class="flab">${esc(rest[0][0])}</span></div>` + AR + fNode(rest[0][1]);
      else if(rest.length > 1) below = AR + `<div class="fbr">${rest.map(([l, c]) => `<div class="fcol"><div class="farw"><span class="flab">${esc(l)}</span></div>${AR}${fNode(c)}</div>`).join('')}</div>`;
    }
  }
  const next = n.n ? AR + fNode(n.n) : '';
  return `<div class="fseg"><div class="frow2"><div class="fmain">${box}</div>${side}</div>${below}${next}</div>`;
}

function wireContact(){
  const g = id => document.getElementById(id);
  const msg = g('c-msg'), flag = g('c-flag'), ok = g('c-ok');
  const RUT = /\b\d{1,2}\.?\d{3}\.?\d{3}\s*[-‐]?\s*[\dkK]\b/;
  const TEL = /\b(\+?56)?\s?9\s?\d{4}\s?\d{4}\b/;
  function check(){
    const t = msg.value;
    const hits = [];
    if(RUT.test(t)) hits.push('un RUT');
    if(TEL.test(t)) hits.push('un teléfono');
    if(hits.length){
      flag.innerHTML = `Parece que el texto contiene ${hits.join(' y ')}. Elimínelo antes de enviar: el canal es para consultas clínicas, no para datos de pacientes.`;
      flag.classList.add('on');
    } else flag.classList.remove('on');
  }
  msg.addEventListener('input', check);
  function compose(){
    const esp = g('c-esp').value, tipo = g('c-tipo').value;
    const cuerpo =
      `Tipo: ${tipo}\nEspecialidad: ${esp}\n` +
      `Nombre: ${g('c-nom').value || '(no indicado)'}\n` +
      `Establecimiento o unidad: ${g('c-est').value || '(no indicado)'}\n\n` +
      `Consulta o sugerencia:\n${msg.value}\n\n` +
      `— Enviado desde el Manual interactivo de criterios de derivación HBLT`;
    return {asunto:`[Manual derivación HBLT] ${tipo} · ${esp}`, cuerpo};
  }
  function say(t, bad){ ok.className='ok on'; ok.style.color = bad ? 'var(--urg)' : ''; ok.textContent = t; }
  function listo(){
    if(!msg.value.trim()){ say('Escriba primero su consulta o sugerencia.', true); msg.focus(); return false; }
    check(); return true;
  }
  async function copiar(txt){
    try{
      await navigator.clipboard.writeText(txt);
      return true;
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      let okc = false;
      try{ okc = document.execCommand('copy'); }catch(e2){}
      ta.remove(); return okc;
    }
  }

  g('c-reg').onclick = async () => {
    if(!listo()) return;
    // No se guardan en la planilla textos que parezcan contener RUT o teléfono
    if(flag.classList.contains('on')){ say('Elimine el RUT o teléfono del texto antes de enviar.', true); msg.focus(); return; }
    const btn = g('c-reg');
    const datos = {
      tipo: g('c-tipo').value,
      especialidad: g('c-esp').value,
      nombre: g('c-nom').value.trim(),
      establecimiento: g('c-est').value.trim(),
      mensaje: msg.value.trim()
    };
    btn.disabled = true; say('Enviando…');
    try{
      // Sin cabecera Content-Type: el navegador usa text/plain y evita el bloqueo CORS de Apps Script
      const r = await fetch(SHEET_URL, {method:'POST', body: JSON.stringify(datos)});
      const res = await r.json();
      if(!res.ok) throw new Error(res.error || 'Error desconocido');
      say('Consulta enviada y registrada. Gracias.');
      msg.value = ''; flag.classList.remove('on');
    }catch(e){
      say('No se pudo enviar la consulta. Intente de nuevo o use "Abrir en Gmail".', true);
      console.error(e);
    }finally{ btn.disabled = false; }
  };

  g('c-copy').onclick = async () => {
    if(!listo()) return;
    const {asunto, cuerpo} = compose();
    const txt = `Para: ${MAIL}\nAsunto: ${asunto}\n\n${cuerpo}`;
    const hecho = await copiar(txt);
    say(hecho
      ? `Consulta copiada. Abra su correo, péguela en un mensaje nuevo dirigido a ${MAIL} y envíela.`
      : `No se pudo copiar automáticamente. Seleccione el texto de la consulta y péguelo en un correo dirigido a ${MAIL}.`, !hecho);
  };

  g('c-gmail').onclick = () => {
    if(!listo()) return;
    const {asunto, cuerpo} = compose();
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(MAIL)}&su=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`, '_blank', 'noopener');
    say('Se abrió Gmail en otra pestaña con el mensaje listo. Revíselo y presione enviar.');
  };

  g('c-outlook').onclick = () => {
    if(!listo()) return;
    const {asunto, cuerpo} = compose();
    window.open(`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(MAIL)}&subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`, '_blank', 'noopener');
    say('Se abrió Outlook web en otra pestaña con el mensaje listo. Revíselo y presione enviar.');
  };

  g('c-send').onclick = () => {
    if(!listo()) return;
    const {asunto, cuerpo} = compose();
    const url = `mailto:${MAIL}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
    const a = document.createElement('a');
    a.href = url; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    say('Si tiene Outlook u otro programa de correo instalado, se abrirá con el mensaje listo. Si no ocurre nada, use "Copiar consulta".');
  };
}

function meta(sp){
  const src = sp.src || '';
  const cod = src.match(/\b(DERIV|SCOG)\s*0?(\d+)/i);
  const ver = src.match(/versi[oó]n\s*([\w.]+)/i);
  const apr = src.match(/aprobado en ([^,.]+)/i);
  const vig = src.match(/vigente hasta ([^,.]+)/i);
  const fec = src.match(/(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre) de (\d{4})/i);
  return {
    cod: cod ? (cod[1].toUpperCase() + ' ' + cod[2].padStart(2,'0')) : null,
    ver: ver ? ver[1].replace(/\.$/,'') : null,
    apr: apr ? apr[1].trim() : (fec ? fec[0] : null),
    vig: vig ? vig[1].trim() : null
  };
}

  markNav(sp.id);
  const grps = reqItems(sp);
  const tones = [...new Set(sp.secs.map(s => s.tone).filter(Boolean))];
  const chk = `<details class="chk" ${keep ? 'open' : ''}>
    <summary>Requisitos mínimos antes de emitir la interconsulta <span class="tag">lista de verificación</span></summary>
    <div class="chk-body">
      ${grps.map(g => `<div class="chk-grp"><h4>${esc(g.title)}</h4>
        ${g.items.map(i => `<label class="chk-it"><input type="checkbox"><span>${inline(i)}</span></label>`).join('')}
      </div>`).join('')}
      <div class="chk-grp"><h4>ESTRUCTURA GENERAL DE LA SIC (apoyo, no proviene del manual)</h4>
        ${GEN.map(i => `<label class="chk-it"><input type="checkbox"><span>${esc(i)}</span></label>`).join('')}</div>
      <div class="chk-act">
        <button class="btn" data-chk="copy">Copiar lista</button>
        <button class="btn" data-chk="clear">Desmarcar todo</button>
      </div>
    </div></details>`;

  const pills = tones.length ? `<div class="pills">
      <button class="pill ${filter ? '' : 'on'}" data-f="">Todo</button>
      ${tones.map(t => `<button class="pill ${filter === t ? 'on' : ''}" data-f="${t}">${LABEL[t]}</button>`).join('')}
    </div>` : '';

  const secs = sp.secs.filter(s => !filter || s.tone === filter);
  view.innerHTML = `
  <div class="spec-head">
    <h1>${esc(sp.name)}</h1>
    ${(()=>{const m=meta(sp);return `<dl class="ficha">
      <div><dt>Código</dt><dd>${m.cod?esc(m.cod):'No declarado'}</dd></div>
      <div><dt>Versión</dt><dd>${m.ver?'v'+esc(m.ver):'No declarada'}</dd></div>
      <div><dt>Aprobación</dt><dd>${m.apr?esc(m.apr):'—'}</dd></div>
      <div><dt>Vigencia</dt><dd>${m.vig?esc(m.vig):'—'}</dd></div></dl>`;})()}
    ${sp.src ? `<div class="src"><b>Documento de origen:</b> ${esc(sp.src)}</div>` : ''}
    ${sp.prio.length ? `<div class="src">${render(sp.prio)}</div>` : ''}
  </div>
  ${chk}
  ${pills}
  ${secs.length ? secs.map(s => `<section class="sec ${s.tone ? 't-'+s.tone : ''}" id="${s.id}">
      <h2>${esc(s.title)}${s.tone ? `<span class="badge b-${s.tone}">${LABEL[s.tone]}</span>` : ''}</h2>
      ${render(s.lines)}
      ${parts(s).cri.length && !/^prioridad/.test(norm(s.title)) ? `<div class="secact"><button class="btn tool" data-tool="${s.id}">Revisar pertinencia y armar la SIC</button></div>
      <div class="toolhost" data-host="${s.id}"></div>` : ''}
    </section>`).join('')
    : `<div class="empty">No hay secciones de ese tipo en este manual.</div>`}
  ${contactHTML()}
  ${footHTML()}`;

  view.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    filter = b.dataset.f || null; renderSpec(sp, true);
  });
  const box = view.querySelector('.chk');
  if(box){
    box.addEventListener('change', e => {
      if(e.target.type === 'checkbox') e.target.closest('.chk-it').classList.toggle('done', e.target.checked);
    });
    box.querySelector('[data-chk="clear"]').onclick = () => {
      box.querySelectorAll('input').forEach(i => { i.checked = false; i.closest('.chk-it').classList.remove('done'); });
    };
    box.querySelector('[data-chk="copy"]').onclick = async () => {
      const txt = `Requisitos mínimos — ${sp.name}\n\n` + [...box.querySelectorAll('.chk-it')]
        .map(l => `[${l.querySelector('input').checked ? 'x' : ' '}] ${l.textContent.trim()}`).join('\n');
      try{ await navigator.clipboard.writeText(txt); }catch(e){}
      const b = box.querySelector('[data-chk="copy"]'); const o = b.textContent;
      b.textContent = 'Lista copiada'; setTimeout(() => b.textContent = o, 1600);
    };
  }
  view.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
    const sec = sp.secs.find(x => x.id === b.dataset.tool);
    const host = view.querySelector(`[data-host="${b.dataset.tool}"]`);
    if(host.firstChild){ host.innerHTML = ''; b.textContent = 'Revisar pertinencia y armar la SIC'; return; }
    host.innerHTML = toolsHTML(sp, sec);
    wireTools(sp, sec, host.firstElementChild);
    host.querySelector('[data-act="close"]').onclick = () => { host.innerHTML = ''; b.textContent = 'Revisar pertinencia y armar la SIC'; };
    b.textContent = 'Ocultar el panel';
  });
  mountCalcs(view);
  wireContact();
  if(!keep) window.scrollTo(0,0);
}

/* ---------------- búsqueda ---------------- */
function renderSearch(q){
  markNav('');
  const terms = expand(q);
  const rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  const match = txt => { const t = norm(txt); return terms.some(term => fuzzyHit(t, term)); };
  const hits = [];
  for(const sp of SPECS){
    for(const s of sp.secs){
      const body = s.lines.filter(l => l.trim() && !/^:::/.test(l.trim()) && match(l));
      const inTitle = match(s.title) || match(sp.name);
      if(!body.length && !inTitle) continue;
      hits.push({sp, s, body:body.slice(0,4), more:Math.max(0, body.length-4)});
    }
  }
  const via = terms.slice(1);
  view.innerHTML = hits.length
    ? `<div class="note"><b>${hits.length}</b> secciones coinciden con “${esc(q)}”.${
        via.length ? ` Se buscó también por ${via.map(v => '<b>'+esc(v)+'</b>').join(', ')}.` : ''}</div>` +
      hits.map((h,i) => `<article class="res" data-i="${i}">
        <div class="rp">${esc(h.sp.name)}</div>
        <div class="rt">${esc(h.s.title).replace(rx,'<mark>$1</mark>')}${h.s.tone ? ` <span class="badge b-${h.s.tone}">${LABEL[h.s.tone]}</span>` : ''}</div>
        ${h.body.map(l => `<div class="rl">${inline(l.replace(/^\s*#+\s*/,'').replace(/^\s*[-*]\s*/,'').replace(/^\s*\d+\.\s*/,'')).replace(rx,'<mark>$1</mark>')}</div>`).join('')}
        ${h.more ? `<div class="rl" style="color:var(--tx3);border:0">+ ${h.more} líneas más</div>` : ''}
      </article>`).join('')
    : `<div class="empty">Sin resultados para “${esc(q)}”. Pruebe con el nombre de la patología, del examen o el código CIE-10.</div>`;
  view.querySelectorAll('.res').forEach(r => r.onclick = () => {
    const h = hits[+r.dataset.i];
    document.getElementById('q').value = ''; document.getElementById('clr').classList.remove('on');
    location.hash = h.sp.id + '/' + h.s.id;
  });
  window.scrollTo(0,0);
}

/* ---------------- ruteo ---------------- */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  if(!h || h === 'inicio'){ renderHome(); return; }
  if(h === 'vigencia'){ renderVig(); return; }
  const [id, sid] = h.split('/');
  const sp = SPECS.find(s => s.id === id);
  if(!sp){ renderHome(); return; }
  filter = null;
  renderSpec(sp);
  if(sid){
    const el = document.getElementById(sid);
    if(el){ el.scrollIntoView(); el.style.boxShadow = '0 0 0 3px rgba(63,154,82,.55)';
            setTimeout(() => el.style.boxShadow = '', 1800); }
  }
}
window.addEventListener('hashchange', route);

const qi = document.getElementById('q'), clr = document.getElementById('clr');
let t = null;
qi.addEventListener('input', () => {
  clearTimeout(t);
  clr.classList.toggle('on', !!qi.value);
  t = setTimeout(() => { qi.value.trim().length >= 2 ? renderSearch(qi.value.trim()) : route(); }, 160);
});
clr.onclick = () => { qi.value = ''; clr.classList.remove('on'); qi.focus(); route(); };
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== qi){ e.preventDefault(); qi.focus(); }
  if(e.key === 'Escape'){ if(document.activeElement === qi){ qi.value=''; clr.classList.remove('on'); qi.blur(); route(); } closeSide(); }
});

route();
</script>
<script>
addEventListener('scroll',()=>{const h=document.querySelector('.hdr'); if(h) h.classList.toggle('scrolled',scrollY>8);},{passive:true});
</script>
<script>
/* Red asistencial: plantita central (hospital) y plantitas pequeñas (establecimientos) que se van conectando */
(function(){
  const C=[170,72], HUB=27, SAT=12;
  const N=[[62,34],[40,106],[112,126],[228,126],[300,106],[278,34],[124,16],[216,16]];
  const RING=[[6,0],[0,1],[1,2],[7,5],[5,4],[4,3],[6,7],[2,3]];
  const sprout=`<symbol id="brote" viewBox="0 0 24 24"><g fill="none" stroke="#1d4d3a" stroke-width="1.3" stroke-linecap="round">
      <path d="M12 21V9"/><path d="M12 13c0-4-2.5-6.5-6.5-7 0 4 2.5 6.5 6.5 7z"/><path d="M12 11c0-4 2.5-6.5 6.5-7 0 4-2.5 6.5-6.5 7z"/></g></symbol>`;
  const plant=(x,y,r,d,cls)=>`<g transform="translate(${x} ${y})"><g class="lf ${cls||''}" style="--d:${d}s">
      <circle r="${r}" fill="#beedc0" stroke="rgba(29,77,58,.35)" stroke-width="1"/>
      <use href="#brote" x="${-r*.56}" y="${-r*.56}" width="${r*1.12}" height="${r*1.12}"/></g></g>`;
  function edge(x1,y1,x2,y2,r1,r2){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
    return `M${(x1+dx/L*r1).toFixed(1)} ${(y1+dy/L*r1).toFixed(1)} L${(x2-dx/L*r2).toFixed(1)} ${(y2-dy/L*r2).toFixed(1)}`;}
  function build(){
    let sats='',spokes='',ring='';
    const tSat=.7, gap=.16;
    N.forEach(([x,y],i)=>{ sats+=plant(x,y,SAT,(tSat+i*gap).toFixed(2)); });
    const tLine=tSat+N.length*gap+.25;
    N.forEach(([x,y],i)=>{ spokes+=`<path class="ln" pathLength="1" style="--d:${(tLine+i*.14).toFixed(2)}s" d="${edge(C[0],C[1],x,y,HUB+2,SAT+2)}"/>`; });
    const tRing=tLine+N.length*.14+.3;
    RING.forEach(([a,b],k)=>{ const [x1,y1]=N[a],[x2,y2]=N[b];
      ring+=`<path class="ln ring" pathLength="1" style="--d:${(tRing+k*.1).toFixed(2)}s" d="${edge(x1,y1,x2,y2,SAT+2,SAT+2)}"/>`; });
    return `<svg class="red" viewBox="0 0 340 144" role="img" aria-label="Red asistencial: hospital conectado con los establecimientos de la red">
      <defs>${sprout}</defs>${ring}${spokes}${sats}${plant(C[0],C[1],HUB,.05,'hub')}</svg>`;
  }
  let played=false;
  function mount(){
    const h=document.querySelector('.hero'); if(!h||h.querySelector('.red'))return;
    const eb=h.querySelector('.eyebrow'); if(!eb)return;
    eb.insertAdjacentHTML('beforebegin',build());
    if(played) h.querySelector('.red').classList.add('done'); else played=true;
  }
  new MutationObserver(mount).observe(document.getElementById('view'),{childList:true}); mount();
})();
</script>
